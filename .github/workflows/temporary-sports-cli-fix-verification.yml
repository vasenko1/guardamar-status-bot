name: Temporary Sports Today CLI fix verification

on:
  push:
    branches:
      - fix/sports-today-cli-choice

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src
      - name: Focused CLI and sports tests
        env:
          PYTHONPATH: src
        run: |
          python -m unittest \
            tests.test_main \
            tests.test_sports_today \
            tests.test_termux_weekend
      - name: Full test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests
