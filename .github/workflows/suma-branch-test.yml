name: Temporary SUMA branch test

on:
  push:
    branches:
      - fix/suma-human-readable-notices

permissions:
  contents: read

jobs:
  suma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_suma.py' -v
      - run: python -m unittest discover -s tests -p 'test_termux_suma.py' -v
      - run: python -m unittest discover -s tests -v
