name: Temporary Slice C verification

on:
  push:
    branches:
      - feat/sports-foundation-slice-c

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src
      - name: Focused Slice C tests
        env:
          PYTHONPATH: src
        run: |
          python -m unittest \
            tests.test_fishing_enrichment \
            tests.test_pesca_cv \
            tests.test_sports_foundation \
            tests.test_event_contract \
            tests.test_event_merge_regression
      - name: Full test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests
