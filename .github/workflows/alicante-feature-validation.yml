name: Alicante feature validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Probe current Avanza planner
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from telegrambot.alicante_schedule import fetch_fares

          today = datetime.now(ZoneInfo("Europe/Madrid")).date()
          dates = (today, today + timedelta(days=1))
          fares = fetch_fares(dates)
          for day in dates:
              print(day, fares[day])
          PY
