name: Alicante feature validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Probe both Avanza directions and dates
        run: |
          python - <<'PY'
          import html as htmlmod
          import http.cookiejar
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          BASE="https://regular.autobusing.com"
          START=BASE+"/info?empresa=costa-azul&locale=es"
          cj=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          headers={"User-Agent":"Mozilla/5.0","Accept":"text/html"}
          with opener.open(urllib.request.Request(START,headers=headers),timeout=30) as r:
              initial=r.read().decode("utf-8","replace")
          hidden={}
          for tag in re.findall(r'(?is)<input\b[^>]*>', initial):
              n=re.search(r'name=["\']([^"\']+)["\']',tag,re.I)
              t=re.search(r'type=["\']([^"\']+)["\']',tag,re.I)
              v=re.search(r'value=["\']([^"\']*)["\']',tag,re.I)
              if n and t and t.group(1).lower()=="hidden":
                  hidden[n.group(1)]=htmlmod.unescape(v.group(1) if v else "")
          today=datetime.now(ZoneInfo("Europe/Madrid")).date()
          for day in (today,today+timedelta(days=1)):
              for origin,destination in (("GUARDAMAR","ALICANTE"),("ALICANTE","GUARDAMAR")):
                  fields=dict(hidden)
                  fields.update({
                      "venta[origen_nombre]":origin,
                      "venta[destino_nombre]":destination,
                      "venta[fecha_ida]":day.strftime("%d/%m/%Y"),
                      "venta[fecha_vta]":"",
                      "venta[tipo_iyv]":"ida",
                  })
                  req=urllib.request.Request(
                      BASE+"/info/horarios",
                      data=urllib.parse.urlencode(fields).encode(),
                      method="POST",
                      headers={
                          **headers,
                          "Content-Type":"application/x-www-form-urlencoded",
                          "Referer":START,
                      },
                  )
                  with opener.open(req,timeout=30) as r:
                      page=r.read().decode("utf-8","replace")
                  rows=re.findall(
                      r'(?is)<tr[^>]*>\s*<td[^>]*>\s*<strong>(\d{2}:\d{2})</strong>\s*</td>\s*'
                      r'<td[^>]*>\s*<strong>(\d{2}:\d{2})</strong>\s*</td>\s*'
                      r'<td[^>]*class=["\'][^"\']*numeric[^"\']*["\'][^>]*>\s*([0-9]+,[0-9]{2})\s*€?\s*</td>',
                      page,
                  )
                  route_text=" ".join(re.sub(r'<[^>]+>',' ',page).split())
                  print(
                      day, origin, "->", destination,
                      "rows",len(rows),
                      "first",rows[:2],
                      "last",rows[-2:],
                      "prices",sorted(set(p for _,_,p in rows)),
                      "route_names",origin in route_text.upper() and destination in route_text.upper(),
                  )
                  if not rows:
                      raise SystemExit("missing rows")
          PY
