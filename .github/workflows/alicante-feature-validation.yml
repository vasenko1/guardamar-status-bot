name: Alicante feature validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Inspect current Avanza schedule response
        run: |
          python - <<'PY'
          import http.cookiejar
          import re
          import urllib.parse
          import urllib.request

          BASE = "https://regular.autobusing.com"
          URL = BASE + "/info?empresa=costa-azul&locale=es"
          cj = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(cj)
          )
          headers={"User-Agent":"Mozilla/5.0","Accept":"text/html"}
          with opener.open(urllib.request.Request(URL,headers=headers),timeout=30) as r:
              initial=r.read().decode("utf-8","replace")
          print("INITIAL_LINKS")
          for m in re.findall(r'(?is)(?:src|href)=["\']([^"\']+)["\']',initial):
              if "js" in m or "info" in m or "venta" in m:
                  print(m)
          print("INITIAL_JS_CLUES")
          for m in re.findall(r'(?is).{0,180}(?:autocomplete|ajax|origen|destino|horarios).{0,280}',initial):
              print(re.sub(r'\s+',' ',m)[:600])

          fields={
              "empresa":"costa-azul",
              "venta[origen_nombre]":"GUARDAMAR",
              "venta[destino_nombre]":"ALICANTE",
              "venta[fecha_ida]":"25/09/2026",
              "venta[fecha_vta]":"",
              "venta[tipo_iyv]":"ida",
          }
          action=BASE+"/info/horarios"
          req=urllib.request.Request(
              action,
              data=urllib.parse.urlencode(fields).encode(),
              method="POST",
              headers={
                  **headers,
                  "Content-Type":"application/x-www-form-urlencoded",
                  "Referer":URL,
              },
          )
          with opener.open(req,timeout=30) as r:
              result=r.read().decode("utf-8","replace")
              print("RESULT_URL",r.geturl(),"STATUS",r.status,"LEN",len(result))
          print("RESULT_TITLE", re.findall(r'(?is)<title[^>]*>(.*?)</title>',result)[:3])
          for label, pat in [
              ("TABLE",r'(?is)<table[^>]*>.*?</table>'),
              ("ROW",r'(?is)<tr[^>]*>.*?</tr>'),
              ("ERROR",r'(?is).{0,120}(?:error|aviso|no hay|sin servicio|incorrect).{0,240}'),
              ("INPUT",r'(?is)<input\b[^>]*>'),
              ("JS",r'(?is).{0,140}(?:precio|salida|llegada|hora|trayecto).{0,260}'),
          ]:
              vals=re.findall(pat,result)
              print(label+"_COUNT",len(vals))
              for v in vals[:30]:
                  print(label,re.sub(r'\s+',' ',v)[:900])
          PY
