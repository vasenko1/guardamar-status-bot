name: Alicante feature validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Inspect current Avanza planner form
        run: |
          python - <<'PY'
          import http.cookiejar
          import re
          import urllib.parse
          import urllib.request
          from html.parser import HTMLParser

          URL = "https://regular.autobusing.com/info?empresa=costa-azul&locale=es"
          cj = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor(cj)
          )
          req = urllib.request.Request(URL, headers={"User-Agent":"Mozilla/5.0"})
          with opener.open(req, timeout=30) as r:
              html = r.read().decode("utf-8", "replace")
              final = r.geturl()
          print("INITIAL_URL", final)
          print("INITIAL_LEN", len(html))

          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.form=None
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=="form":
                      print("FORM", a)
                  elif tag in {"input","select","option","button"}:
                      name=a.get("name","")
                      if name or tag=="option":
                          safe={k:v for k,v in a.items() if k not in {"value"}}
                          val=a.get("value")
                          if val is not None and len(val) <= 120:
                              safe["value"]=val
                          print(tag.upper(), safe)
          P().feed(html)

          # Try the current adapter's submission and print only structural clues.
          required = {
              "venta[origen_nombre]":"GUARDAMAR",
              "venta[destino_nombre]":"ALICANTE",
              "venta[fecha_ida]":"25/09/2026",
          }
          hidden={}
          for m in re.finditer(r'<input\b[^>]*>', html, re.I):
              tag=m.group(0)
              nm=re.search(r'name=["\']([^"\']+)["\']',tag,re.I)
              tp=re.search(r'type=["\']([^"\']+)["\']',tag,re.I)
              va=re.search(r'value=["\']([^"\']*)["\']',tag,re.I)
              if nm and (not tp or tp.group(1).lower()=="hidden"):
                  hidden[nm.group(1)] = va.group(1) if va else ""
          fields={**hidden, **required}
          data=urllib.parse.urlencode(fields).encode()
          post=urllib.request.Request(
              final, data=data, method="POST",
              headers={
                  "User-Agent":"Mozilla/5.0",
                  "Content-Type":"application/x-www-form-urlencoded",
                  "Referer":final,
              }
          )
          try:
              with opener.open(post, timeout=30) as r:
                  result=r.read().decode("utf-8","replace")
                  print("POST_URL", r.geturl())
                  print("POST_STATUS", r.status)
          except Exception as exc:
              print("POST_ERROR", type(exc).__name__, str(exc))
          else:
              print("POST_LEN", len(result))
              for pat in [
                  r'<title[^>]*>.*?</title>',
                  r'(?is).{0,180}(?:precio|salida|llegada|guardamar|alicante|error|aviso).{0,300}',
              ]:
                  matches=re.findall(pat,result,re.I|re.S)
                  print("MATCHES", [re.sub(r'\s+',' ',x)[:500] for x in matches[:30]])
          PY
