name: Alicante feature validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Compile sources
        run: python -m compileall -q src tests
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
      - name: Probe live Alicante adapter
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from telegrambot.alicante_schedule import fetch_schedules

          today = datetime.now(ZoneInfo("Europe/Madrid")).date()
          dates = (today, today + timedelta(days=1))
          schedules = fetch_schedules(dates)
          if set(schedules) != set(dates):
              raise SystemExit(f"incomplete dates: {sorted(schedules)}")
          for day in dates:
              item = schedules[day]
              if item.fare is None:
                  raise SystemExit(f"missing validated fare for {day}")
              print(
                  day,
                  "to_alicante", len(item.to_alicante),
                  item.to_alicante[0], item.to_alicante[-1],
                  "from_alicante", len(item.from_alicante),
                  item.from_alicante[0], item.from_alicante[-1],
                  "fare", item.fare,
              )
          PY
