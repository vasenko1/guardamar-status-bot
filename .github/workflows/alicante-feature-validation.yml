name: Alicante feature validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Compile sources
        run: python -m compileall -q src tests
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
      - name: Probe current Alicante sources
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from telegrambot.alicante_schedule import fetch_fares, fetch_schedules

          today = datetime.now(ZoneInfo("Europe/Madrid")).date()
          dates = (today, today + timedelta(days=1))
          schedules = fetch_schedules(dates)
          for day in dates:
              item = schedules[day]
              print(day, "GTFS", item.to_alicante, item.from_alicante)
          try:
              fares = fetch_fares(dates)
          except Exception as exc:
              print("FARE_PROBE_UNAVAILABLE", type(exc).__name__, str(exc))
          else:
              for day in dates:
                  print(day, "FARE", fares[day])
          PY
