name: Temporary PR 318 tests

on:
  push:
    branches:
      - feat/tomorrow-market-alert

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Focused tests
        run: >-
          python -m unittest
          tests.test_holidays
          tests.test_agenda
          tests.test_gemini
          tests.test_mayor
          tests.test_tomorrow_events
          tests.test_main
      - name: Full suite
        run: python -m unittest discover -s tests
