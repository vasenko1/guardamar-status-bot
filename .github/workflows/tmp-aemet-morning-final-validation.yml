name: Temporary AEMET morning final validation

on:
  push:
    branches:
      - feature/aemet-morning-warning-ux
    paths:
      - .github/workflows/tmp-aemet-morning-final-validation.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aemet-morning-warning-ux
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e .
      - name: Focused tests
        run: |
          python -m unittest \
            tests.test_aemet \
            tests.test_aemet_warning_updates \
            tests.test_aemet_morning_warning_ux \
            tests.test_digest \
            tests.test_operational_updates \
            -q
      - name: Full test suite
        run: python -m unittest discover -s tests -q
