name: Probe product award sources

on:
  push:
    branches:
      - feat/private-label-product-awards-poc

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe Mercadona and WCCC
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request

          ua = {"User-Agent": "GuardamarMorningDigest/0.13"}

          def request(url, *, method="GET", data=None, headers=None):
              merged = dict(ua)
              if headers:
                  merged.update(headers)
              req = urllib.request.Request(url, data=data, headers=merged, method=method)
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.status, dict(r.headers.items()), r.read()

          print("=== MERCADONA POSTAL CODE ===")
          payload = json.dumps({"new_postal_code": "03140"}).encode()
          status, headers, body = request(
              "https://tienda.mercadona.es/api/postal-codes/actions/change-pc/",
              method="PUT",
              data=payload,
              headers={"Content-Type": "application/json"},
          )
          print("status", status)
          wh = headers.get("x-customer-wh") or headers.get("X-Customer-Wh")
          pc = headers.get("x-customer-pc") or headers.get("X-Customer-Pc")
          print("pc", pc)
          print("wh", wh)

          print("=== MERCADONA PRODUCT 50952 ===")
          suffix = f"?lang=es&wh={wh}" if wh else "?lang=es"
          status, headers, body = request(
              "https://tienda.mercadona.es/api/products/50952/" + suffix
          )
          print("status", status)
          obj = json.loads(body)
          print("keys", sorted(obj))
          for key in ("id", "display_name", "packaging", "published"):
              if key in obj:
                  print(key, obj[key])
          pi = obj.get("price_instructions")
          print("price_instruction_keys", sorted(pi) if isinstance(pi, dict) else None)
          if isinstance(pi, dict):
              for key in ("unit_price", "bulk_price", "unit_size", "size_format", "reference_price", "reference_format"):
                  if key in pi:
                      print("price."+key, pi[key])
          print("ean", obj.get("ean"))
          print("share_url", obj.get("share_url"))

          print("=== WCCC RESULTS HTML LINKS ===")
          status, headers, body = request("https://worldchampioncheese.org/results/")
          print("status", status, "bytes", len(body))
          text = body.decode("utf-8", "replace")
          urls = []
          for match in re.finditer(r'''(?:src|href)=["']([^"']+)["']''', text, re.I):
              url = match.group(1)
              low = url.lower()
              if any(token in low for token in ("result", "contest", "myentries", "iframe", "score", "class")):
                  if url not in urls:
                      urls.append(url)
          for url in urls[:80]:
              print(url)
          PY
