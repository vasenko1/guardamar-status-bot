name: Validate Product Awards DIA image referer

on:
  push:
    branches:
      - fix/product-awards-dia-image-referer

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Focused Product Awards tests
        run: python -m unittest discover -s tests -p 'test_product_awards*.py' -v
      - name: Full unittest suite
        run: python -m unittest discover -s tests -v
