name: Temporary age label review fix

on:
  push:
    branches:
      - ux-activities-index-mobile

permissions:
  contents: write

jobs:
  fix-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Apply review fix
        run: python tools/fix_activity_age_labels.py
      - name: Targeted tests
        run: python -m unittest tests.test_activity_index_ux tests.test_music_pinned tests.test_pinned -v
      - name: Full suite
        run: python -m unittest discover -s tests -v
      - name: Commit fix and remove temporary helpers
        run: |
          rm tools/fix_activity_age_labels.py
          rm .github/workflows/tmp-age-label-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/telegrambot/pinned.py tests/test_activity_index_ux.py docs/kb/11_Pinned_Message_Content.md
          git add -u tools/fix_activity_age_labels.py .github/workflows/tmp-age-label-review.yml
          git commit -m "Correct activity index age labels"
          git push origin HEAD:ux-activities-index-mobile
