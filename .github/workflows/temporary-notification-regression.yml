name: Temporary notification regression

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q src
      - name: Shell syntax
        run: |
          sh -n termux/install-guide-cron.sh
          sh -n termux/install-transport-cron.sh
          sh -n termux/publish-course-notifications.sh
          sh -n termux/publish-transport-notifications.sh
          sh -n termux/sync-guide.sh
          sh -n termux/sync-transport.sh
      - name: Full regression suite
        run: python -m pytest -q
