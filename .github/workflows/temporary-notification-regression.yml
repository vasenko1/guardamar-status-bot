name: Temporary notification regression

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q src
      - run: >
          python -m pytest -q
          tests/test_course_notifications.py
          tests/test_transport_notifications.py
          tests/test_transport_schedules.py
          tests/test_guide.py
          tests/test_sporttia_guide.py
          tests/test_music_school.py
          tests/test_music_pinned.py
          tests/test_recurring_activities.py
