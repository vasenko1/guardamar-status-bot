name: Elche Orihuela source probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Inspect Orihuela official fare
        run: |
          python - <<'PY'
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from zoneinfo import ZoneInfo

          from telegrambot import airport_schedule as bs

          today = datetime.now(ZoneInfo("Europe/Madrid")).date()
          body = urllib.parse.urlencode({
              "accion":3,
              "idioma":"es",
              "FECHASALIDA":today.strftime("%d/%m/%Y"),
              "ORIGEN":"GUARDAMAR DEL SEGURA",
              "DESTINO":"ORIHUELA",
          }).encode("ascii")
          req=urllib.request.Request(
              bs.SEARCH_URL,data=body,method="POST",
              headers={
                  "Accept":"text/html",
                  "Content-Type":"application/x-www-form-urlencoded",
                  "User-Agent":bs.USER_AGENT,
              })
          payload,final_url,headers,status=bs._open_bounded(req,bs.HTML_LIMIT_BYTES)
          page=payload.decode("utf-8")
          active=re.sub(r"<!--.*?-->","",page,flags=re.S)
          links=re.findall(r'href=["\']([^"\']+\.pdf(?:\?[^"\']*)?)["\']',active,re.I)
          links=tuple(dict.fromkeys(
              bs._normalized_url(urllib.parse.urljoin(bs.PLANNER_URL,x))
              for x in links
          ))
          print("FARE_URLS",links)
          if len(links)!=1:
              raise SystemExit("fare link ambiguous")
          pdf=bs.download_fare_pdf(links[0],None,None,force=True)
          if pdf is None:
              raise SystemExit("unexpected 304")
          with TemporaryDirectory() as d:
              path=Path(d)/"fare.pdf"
              path.write_bytes(pdf.payload)
              text=bs._run(["pdftotext","-layout",str(path),"-"]).decode("utf-8","replace")
          markers=[
              "LÍNEA 1:",
              "TARIFA BASE GENERAL",
              "ORIHUELA",
              "GUARDAMAR",
          ]
          for marker in markers:
              print("COUNT",marker,text.count(marker))
          line1=text.find("LÍNEA 1:")
          line2=text.find("LÍNEA 2:",line1+1)
          segment=text[line1:line2 if line2>line1 else len(text)]
          for line in segment.splitlines():
              if (
                  "ORIHUELA" in line
                  or "GUARDAMAR" in line
                  or "TARIFA BASE GENERAL" in line
                  or re.search(r"\d+,\d{2}\s*€",line)
              ):
                  print("FARE_LINE",repr(line))
          PY
