name: Elche Orihuela validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install package and PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install -e .
      - name: Compile sources
        run: python -m compileall -q src tests
      - name: Run regression suite
        run: python -m unittest discover -s tests -v
      - name: Live source validation
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          from pathlib import Path
          from tempfile import TemporaryDirectory

          from telegrambot import airport_schedule as bus
          from telegrambot.elche_schedule import fetch_bundle as fetch_elche
          from telegrambot.orihuela_schedule import (
              _fetch_schedule as fetch_orihuela_schedule,
              fetch_bundle as fetch_orihuela,
          )

          today = datetime.now(ZoneInfo("Europe/Madrid")).date()
          tomorrow = today + timedelta(days=1)

          schedule_probe, fare_url = fetch_orihuela_schedule(today)
          if fare_url is not None:
              downloaded = bus.download_fare_pdf(
                  fare_url, None, None, force=True
              )
              if downloaded is not None:
                  with TemporaryDirectory() as directory:
                      path = Path(directory) / "fare.pdf"
                      path.write_bytes(downloaded.payload)
                      fare_text = bus._run([
                          "pdftotext", "-layout", str(path), "-"
                      ]).decode("utf-8", "replace")
                  start = fare_text.find(
                      "TARIFA BASE GENERAL",
                      fare_text.find("LÍNEA 1:"),
                  )
                  end = fare_text.find(
                      "TARIFA MAYORES DE 65 AÑOS", start
                  )
                  print("ORIHUELA_BASE_SECTION_BEGIN")
                  for index, line in enumerate(
                      fare_text[start:end].splitlines()
                  ):
                      if line.strip():
                          print(index, repr(line))
                  print("ORIHUELA_BASE_SECTION_END")

          for name, fetcher, expected_today_fare in (
              ("ELCHE", fetch_elche, 360),
              ("ORIHUELA", fetch_orihuela, 345),
          ):
              bundle = fetcher(today, None)
              if bundle.current.service_date != today:
                  raise SystemExit(f"{name}: current date mismatch")
              if bundle.current.fare is None:
                  raise SystemExit(f"{name}: current fare missing")
              if bundle.current.fare.cents != expected_today_fare:
                  raise SystemExit(
                      f"{name}: unexpected current fare "
                      f"{bundle.current.fare.cents}"
                  )
              print(
                  name,
                  today,
                  len(bundle.current.outbound),
                  bundle.current.outbound,
                  len(bundle.current.inbound),
                  bundle.current.inbound,
                  bundle.current.fare,
              )
              if bundle.next is None:
                  print(name, tomorrow, "NEXT_UNAVAILABLE")
              else:
                  if bundle.next.service_date != tomorrow:
                      raise SystemExit(f"{name}: next date mismatch")
                  print(
                      name,
                      tomorrow,
                      len(bundle.next.outbound),
                      bundle.next.outbound,
                      len(bundle.next.inbound),
                      bundle.next.inbound,
                      bundle.next.fare,
                  )
          PY
