name: Traffic readable segments validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m compileall -q src tests
      - run: python -m unittest tests.test_traffic
      - run: python -m unittest tests.test_electricity tests.test_traffic
      - run: python -m unittest discover -s tests
