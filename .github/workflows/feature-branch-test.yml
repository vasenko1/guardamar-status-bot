name: Feature branch media final test

on:
  push:
    branches:
      - feat/tomorrow-event-announcements

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Probe AM Guardamar embedded media response
        continue-on-error: true
        run: |
          python - <<'PY'
          from telegrambot.am_guardamar import _read_posts
          posts = _read_posts()
          print(f"AM_GUARDAMAR_POSTS={len(posts)}")
          print(f"AM_GUARDAMAR_WITH_EMBEDDED_MEDIA={sum(bool(p.get('_embedded')) for p in posts)}")
          PY
