name: Temporary airport TLS live smoke

on:
  push:
    branches:
      - fix-airport-tls-recovery

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install OpenSSL and project
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl
          python -m pip install -e .
      - name: Fetch tomorrow from official Bus Sigüenza source
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          import telegrambot.airport_schedule as airport

          service_date = datetime.now(ZoneInfo("Europe/Madrid")).date() + timedelta(days=1)
          result = airport.fetch_schedule(service_date)
          schedule = result.schedule
          assert schedule.service_date == service_date
          assert schedule.to_airport
          assert schedule.from_airport
          print(
              "LIVE_OK",
              schedule.service_date.isoformat(),
              len(schedule.to_airport),
              len(schedule.from_airport),
              "tls_repaired=", airport._BUS_TLS_CONTEXT is not None,
          )
          PY
