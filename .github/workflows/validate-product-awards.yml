name: Validate product awards

on:
  push:
    branches:
      - feat/private-label-product-awards-poc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Product award tests
        run: python -m unittest -v tests.test_product_awards tests.test_product_awards_main
      - name: Full test suite
        run: python -m unittest discover -s tests -t . -v
