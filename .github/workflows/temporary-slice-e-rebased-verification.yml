name: Temporary Slice E rebased verification

on:
  push:
    branches:
      - feat/sports-publication-slice-e-rebased

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src
      - name: Focused Slice E tests
        env:
          PYTHONPATH: src
        run: |
          python -m unittest \
            tests.test_sports_foundation \
            tests.test_fishing_enrichment \
            tests.test_pesca_cv \
            tests.test_planning_events \
            tests.test_tomorrow_events \
            tests.test_weekend \
            tests.test_sports_today \
            tests.test_digest \
            tests.test_main \
            tests.test_mayor \
            tests.test_gemini
      - name: Full test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests
