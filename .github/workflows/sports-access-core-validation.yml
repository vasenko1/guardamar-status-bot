name: Sports access core validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Check patch whitespace
        run: git diff --check HEAD^1 HEAD

      - name: Run focused event-access and sports tests
        run: |
          python -m unittest \
            tests.test_event_access \
            tests.test_event_registration_notifications \
            tests.test_sports_foundation

      - name: Run full repository test suite
        run: python -m unittest discover -s tests -p 'test_*.py'
