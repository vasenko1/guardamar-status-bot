name: Temporary Palau review fix

on:
  push:
    branches:
      - feature/palau-activity-card-ux
    paths:
      - .github/workflows/tmp-palau-review-fix.yml

permissions:
  contents: write

jobs:
  fix-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/palau-activity-card-ux
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Apply reviewed Palau contact
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/telegrambot/pinned.py')
          text = path.read_text(encoding='utf-8')
          old = (
              '        "Av. Europa, s/n",\n'
              '        "📞 <b>Телефон:</b> <code>966726335</code>",\n'
              '        f"✉️ <b>Email:</b> <code>{SPORTS_CONTACT_EMAIL}</code>",\n'
          )
          new = (
              '        "Av. Europa, s/n",\n'
              '        "📞 <b>Телефон:</b> <code>965357693</code>",\n'
              '        f"✉️ <b>Email:</b> <code>{SPORTS_CONTACT_EMAIL}</code>",\n'
          )
          if text.count(old) != 1:
              raise SystemExit('Palau contact baseline did not match')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_palau_activity_ux.py')
          value = test.read_text(encoding='utf-8')
          if value.count('<code>966726335</code>') != 1:
              raise SystemExit('Palau phone test baseline did not match')
          test.write_text(
              value.replace('<code>966726335</code>', '<code>965357693</code>', 1),
              encoding='utf-8',
          )
          PY
      - name: Focused tests
        run: >-
          PYTHONPATH=src python -m unittest
          tests.test_pinned
          tests.test_sporttia_guide
          tests.test_guide_navigation_followup
          tests.test_youth_centre_place
          tests.test_palau_activity_ux
          -q
      - name: Full test suite
        run: PYTHONPATH=src python -m unittest discover -s tests -q
      - name: Commit review fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/telegrambot/pinned.py tests/test_palau_activity_ux.py
          git commit -m "fix: use current Palau phone contact"
          git push origin HEAD:feature/palau-activity-card-ux
