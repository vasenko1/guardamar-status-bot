name: Temporary activity index final CI

on:
  push:
    branches:
      - ux-activities-index-mobile-ci2

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Targeted tests
        run: python -m unittest tests.test_activity_index_ux tests.test_music_pinned tests.test_pinned -v
      - name: Full suite
        run: python -m unittest discover -s tests -v
