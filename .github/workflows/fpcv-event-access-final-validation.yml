name: FPCV Event Access Final Validation

on:
  push:
    branches:
      - feat/fpcv-event-access-final

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Whitespace
        run: git diff --check 3a10decd21c3941650940f2fdf5c6d0c056d3648 HEAD
      - name: Focused tests
        env:
          PYTHONPATH: src
        run: |
          python -m unittest \
            tests.test_fishing_enrichment \
            tests.test_pesca_cv \
            tests.test_event_access \
            tests.test_event_registration_notifications \
            tests.test_sports_foundation \
            tests.test_sports_today
      - name: Full tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_*.py'
