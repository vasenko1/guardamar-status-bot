name: PR 92 temporary tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check current municipal Wi-Fi source
        run: |
          python - <<'PY'
          import asyncio
          from telegrambot.guide import WIFI_VERIFIED_ASSET_URL, fetch_current_wifi_asset

          current = asyncio.run(fetch_current_wifi_asset())
          print(current)
          if current != WIFI_VERIFIED_ASSET_URL:
              raise SystemExit(f"unexpected Wi-Fi asset: {current}")
          PY
