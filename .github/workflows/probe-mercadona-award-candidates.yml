name: Probe Mercadona award candidates

on:
  push:
    branches:
      - feat/private-label-product-awards-poc

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe exact candidate SKUs
        run: |
          python - <<'PY'
          import json, re, urllib.request

          ids=["4883","5548","17926","11682","11672","50943","50944","50945","50946"]
          headers={"Accept":"application/json","User-Agent":"GuardamarMorningDigest/0.13"}

          def clean(value):
              if not isinstance(value,str):
                  return value
              return re.sub(r"<[^>]+>","",value).replace("\n"," ").strip()

          for pid in ids:
              print(f"=== {pid} ===")
              url=f"https://tienda.mercadona.es/api/products/{pid}/?lang=es&wh=alc1"
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      obj=json.load(r)
              except Exception as exc:
                  print("ERROR",type(exc).__name__,str(exc))
                  continue
              pi=obj.get("price_instructions") or {}
              details=obj.get("details") or {}
              nutrition=obj.get("nutrition_information") or {}
              print("id",obj.get("id"))
              print("name",obj.get("display_name"))
              print("ean",obj.get("ean"))
              print("brand",obj.get("brand"))
              print("published",obj.get("published"))
              print("variable",obj.get("is_variable_weight"))
              print("unavailable_from",obj.get("unavailable_from"))
              print("unavailable_weekdays",obj.get("unavailable_weekdays"))
              print("price",pi.get("unit_price"))
              print("reference_price",pi.get("reference_price"),pi.get("reference_format"))
              print("unit_size",pi.get("unit_size"),pi.get("size_format"))
              print("share_url",obj.get("share_url"))
              print("supplier",json.dumps(details.get("suppliers"),ensure_ascii=False))
              print("legal_name",clean(details.get("legal_name")))
              print("mandatory",clean(details.get("mandatory_mentions")))
              print("ingredients",clean(nutrition.get("ingredients")))
          PY
