name: Probe ALDI product index

on:
  push:
    branches:
      - feat/private-label-product-awards-poc

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Search public ALDI Algolia index
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request

          app="L9KNU74IO7"
          key="83df5acd172c42ab174afa4583232b5d"
          url=f"https://{app}-dsn.algolia.net/1/indexes/*/queries"
          headers={
              "Content-Type":"application/json",
              "x-algolia-application-id":app,
              "x-algolia-api-key":key,
              "User-Agent":"GuardamarMorningDigest/0.13",
          }
          indexes=[
              "an_prd_es_es_products2",
              "an_prd_es_ES_products2",
              "an_prd_es_es_es_products2",
          ]
          queries=["Sal de Plata","atún claro aceite de oliva","atun claro aceite oliva"]
          requests=[]
          for index in indexes:
              for query in queries:
                  params=urllib.parse.urlencode({"query":query,"hitsPerPage":20})
                  requests.append({"indexName":index,"params":params})
          data=json.dumps({"requests":requests}).encode()
          req=urllib.request.Request(url,data=data,headers=headers,method="POST")
          try:
              with urllib.request.urlopen(req,timeout=20) as r:
                  obj=json.load(r)
          except Exception as e:
              print("ERROR",type(e).__name__,str(e))
              raise
          for request,result in zip(requests,obj.get("results",[])):
              print("===",request["indexName"],request["params"],"===")
              if "error" in result:
                  print("ERROR_RESULT",result.get("message") or result.get("error"))
                  continue
              print("nbHits",result.get("nbHits"))
              for hit in result.get("hits",[])[:20]:
                  keep={k:hit.get(k) for k in (
                      "objectID","name","productSlug","brandName","variantName",
                      "salesUnit","currentPrice","promotion","promotionPrices",
                      "isAvailable","isComingSoon","advertisingOnlineDateFrom",
                      "advertisingOnlineDateUntil","shortDescription",
                      "longDescription","additionalAttributes","productReferences",
                  )}
                  print(json.dumps(keep,ensure_ascii=False,sort_keys=True))
          PY
