name: Probe WCCC Valle de San Juan results

on:
  push:
    branches:
      - feat/private-label-product-awards-poc

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find official Valle de San Juan 2026 results
        run: |
          python - <<'PY'
          import json, urllib.request

          headers={"Accept":"application/json","User-Agent":"GuardamarMorningDigest/0.13"}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.load(r)

          classes=get("https://myentries.org/api/results/contest-classes/71")
          print("classes",len(classes))
          found=[]
          for i, cls in enumerate(classes,1):
              cid=cls["id"]
              try:
                  data=get(f"https://myentries.org/api/results/contest-class-results/{cid}")
              except Exception as e:
                  print("ERR",cid,type(e).__name__,str(e)[:100])
                  continue
              blob=data.get("results",data) if isinstance(data,dict) else data
              def walk(v):
                  if isinstance(v,dict):
                      scalar=" ".join(str(x) for x in v.values() if not isinstance(x,(dict,list))).upper()
                      if "VALLE DE SAN JUAN" in scalar:
                          found.append((cls,v.copy()))
                      for x in v.values(): walk(x)
                  elif isinstance(v,list):
                      for x in v: walk(x)
              walk(blob)
              if i%25==0:
                  print("checked",i)
          print("=== MATCHES ===")
          seen=set()
          for cls,row in found:
              key=json.dumps(row,sort_keys=True,ensure_ascii=False)
              if key in seen: continue
              seen.add(key)
              print("CLASS",cls["id"],cls["number"],cls["name"])
              print(json.dumps(row,ensure_ascii=False,sort_keys=True))
          PY
