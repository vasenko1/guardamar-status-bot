name: Probe Mercadona award candidates

on:
  push:
    branches:
      - feat/private-label-product-awards-poc

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe exact candidate SKUs
        run: |
          python - <<'PY'
          import json, urllib.request

          headers={"Accept":"application/json","User-Agent":"GuardamarMorningDigest/0.13"}
          ids=["4883","5548","17926","50975","50944","11682"]
          for pid in ids:
              print(f"=== PRODUCT {pid} ===")
              url=f"https://tienda.mercadona.es/api/products/{pid}/?lang=es&wh=alc1"
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      obj=json.load(r)
                  print("id",obj.get("id"))
                  print("name",obj.get("display_name"))
                  print("ean",obj.get("ean"))
                  print("brand",obj.get("brand"))
                  print("published",obj.get("published"))
                  print("unavailable_from",obj.get("unavailable_from"))
                  print("unavailable_weekdays",obj.get("unavailable_weekdays"))
                  print("share_url",obj.get("share_url"))
                  details=obj.get("details") or {}
                  print("suppliers",json.dumps(details.get("suppliers"),ensure_ascii=False))
                  print("legal_name",details.get("legal_name"))
                  print("mandatory_mentions",details.get("mandatory_mentions"))
                  nutrition=obj.get("nutrition_information") or {}
                  print("ingredients",nutrition.get("ingredients"))
                  pi=obj.get("price_instructions") or {}
                  for k in ("unit_price","reference_price","reference_format","unit_size","size_format","approx_size"):
                      print("price."+k,pi.get(k))
              except Exception as e:
                  print("ERROR",type(e).__name__,str(e)[:300])
          PY
