name: Probe ALDI Algolia config

on:
  push:
    branches:
      - feat/private-label-product-awards-poc

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Locate ALDI search client config
        run: |
          python - <<'PY'
          import re, urllib.parse, urllib.request
          ua={"User-Agent":"GuardamarMorningDigest/0.13"}
          page="https://www.aldi.es/busqueda.html"
          req=urllib.request.Request(page,headers=ua)
          with urllib.request.urlopen(req,timeout=20) as r:
              raw=r.read(2_000_000).decode("utf-8","replace")
          scripts=[]
          for m in re.finditer(r'<script[^>]+src=["\']([^"\']+)["\']',raw,re.I):
              u=urllib.parse.urljoin(page,m.group(1))
              if "_next/static/chunks/" in u and u not in scripts:
                  scripts.append(u)
          targets=("40994:","oY:", "an_prd_es_LANG_REGION_products2","searchClient","applicationId","apiKey")
          for u in scripts:
              try:
                  req=urllib.request.Request(u,headers=ua)
                  with urllib.request.urlopen(req,timeout=20) as r:
                      js=r.read(4_000_000).decode("utf-8","replace")
              except Exception:
                  continue
              positions=[]
              for token in targets:
                  pos=js.find(token)
                  if pos>=0:
                      positions.append((token,pos))
              if not positions:
                  continue
              print("=== SCRIPT",u,"BYTES",len(js),"===")
              for token,pos in positions:
                  print("TOKEN",token)
                  a=max(0,pos-1800); b=min(len(js),pos+7000)
                  print(js[a:b])
                  print("---")
          PY
