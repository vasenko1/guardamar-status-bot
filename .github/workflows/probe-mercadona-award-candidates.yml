name: Probe ALDI search module

on:
  push:
    branches:
      - feat/private-label-product-awards-poc

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Locate module 17851
        run: |
          python - <<'PY'
          import re, urllib.parse, urllib.request
          ua={"User-Agent":"GuardamarMorningDigest/0.13"}
          page="https://www.aldi.es/busqueda.html"
          req=urllib.request.Request(page,headers=ua)
          with urllib.request.urlopen(req,timeout=20) as r:
              raw=r.read(2_000_000).decode("utf-8","replace")
          scripts=[]
          for m in re.finditer(r'<script[^>]+src=["\']([^"\']+)["\']',raw,re.I):
              u=urllib.parse.urljoin(page,m.group(1))
              if "_next/static/chunks/" in u and u not in scripts:
                  scripts.append(u)
          for u in scripts:
              try:
                  req=urllib.request.Request(u,headers=ua)
                  with urllib.request.urlopen(req,timeout=20) as r:
                      js=r.read(4_000_000).decode("utf-8","replace")
              except Exception:
                  continue
              for token in ("17851:","17851=(","17851:(e","17851:(t"):
                  pos=js.find(token)
                  if pos>=0:
                      print("FOUND",u,"TOKEN",token,"BYTES",len(js))
                      a=max(0,pos-1200); b=min(len(js),pos+22000)
                      print(js[a:b])
                      raise SystemExit
          print("NOT_FOUND")
          PY
