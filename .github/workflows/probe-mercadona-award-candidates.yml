name: Probe ALDI Naltros exact product

on:
  push:
    branches:
      - feat/private-label-product-awards-poc

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect Naltros Next data
        run: |
          python - <<'PY'
          import json, re, urllib.request
          url="https://www.aldi.es/p/cava-brut-190300.html"
          req=urllib.request.Request(url,headers={"User-Agent":"GuardamarMorningDigest/0.13"})
          with urllib.request.urlopen(req,timeout=20) as r:
              raw=r.read(2_000_000).decode("utf-8","replace")
              print("STATUS",r.status,"TYPE",r.headers.get_content_type(),"BYTES",len(raw),"FINAL",r.geturl())
          m=re.search(r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>',raw,re.S)
          if not m:
              raise SystemExit("NO_NEXT_DATA")
          data=json.loads(m.group(1))
          matches=[]
          def walk(v,path="root"):
              if isinstance(v,dict):
                  if str(v.get("objectID",""))=="190300":
                      matches.append((path,v))
                  for k,x in v.items():
                      walk(x,f"{path}.{k}")
              elif isinstance(v,list):
                  for i,x in enumerate(v):
                      walk(x,f"{path}[{i}]")
          walk(data)
          print("MATCHES",len(matches))
          for path,obj in matches:
              print("PATH",path)
              keep={k:obj.get(k) for k in (
                  "objectID","name","productSlug","brandName","salesUnit",
                  "isAvailable","isComingSoon","isRecall","currentPrice",
                  "productReferences","longDescription"
              )}
              print(json.dumps(keep,ensure_ascii=False,sort_keys=True))
          print("REGION",((data.get("props") or {}).get("pageProps") or {}).get("page",{}).get("region"))
          PY
