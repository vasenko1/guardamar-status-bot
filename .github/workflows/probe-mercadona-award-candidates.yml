name: Probe Mercadona award candidates

on:
  push:
    branches:
      - feat/private-label-product-awards-poc

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe reviewed Mercadona candidate SKUs
        run: |
          python - <<'PY'
          import json, urllib.request

          headers={"Accept":"application/json","User-Agent":"GuardamarMorningDigest/0.13"}
          skus=["4883","5548","11682","17926","11672"]
          for sku in skus:
              print(f"=== SKU {sku} ===")
              url=f"https://tienda.mercadona.es/api/products/{sku}/?lang=es&wh=alc1"
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      obj=json.load(r)
              except Exception as e:
                  print("ERROR",type(e).__name__,str(e)[:300])
                  continue
              print("id",obj.get("id"))
              print("display_name",obj.get("display_name"))
              print("ean",obj.get("ean"))
              print("brand",obj.get("brand"))
              print("published",obj.get("published"))
              print("unavailable_from",obj.get("unavailable_from"))
              print("unavailable_weekdays",obj.get("unavailable_weekdays"))
              print("share_url",obj.get("share_url"))
              print("is_variable_weight",obj.get("is_variable_weight"))
              pi=obj.get("price_instructions") or {}
              for key in ("unit_price","reference_price","reference_format","unit_size","size_format","approx_size"):
                  print("price."+key,pi.get(key))
              details=obj.get("details") or {}
              print("legal_name",details.get("legal_name"))
              print("mandatory_mentions",details.get("mandatory_mentions"))
              print("suppliers",json.dumps(details.get("suppliers"),ensure_ascii=False))
              nutrition=obj.get("nutrition_information") or {}
              print("ingredients",json.dumps(nutrition.get("ingredients"),ensure_ascii=False))
          PY
