name: Probe WCCC full results

on:
  push:
    branches:
      - feat/private-label-product-awards-poc

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe MyEntries results
        run: |
          python - <<'PY'
          import re, urllib.request
          url="https://myentries.org/results"
          req=urllib.request.Request(url,headers={"User-Agent":"GuardamarMorningDigest/0.13"})
          with urllib.request.urlopen(req,timeout=20) as r:
              body=r.read()
              print("status",r.status)
              print("type",r.headers.get_content_type())
              print("final",r.geturl())
          text=body.decode("utf-8","replace")
          print("bytes",len(body))
          for needle in ("2026","World Championship","Valle","Entrepinares","result","api","graphql","fetch(","axios","script"):
              print("NEEDLE",needle,"COUNT",text.lower().count(needle.lower()))
          print("=== URLS ===")
          seen=[]
          for m in re.finditer(r'https?://[^"\'<>\s]+',text):
              u=m.group(0).replace("&amp;","&")
              if u not in seen:
                  seen.append(u)
          for u in seen[:120]:
              print(u)
          print("=== FORM/AJAX LINES ===")
          for line in text.splitlines():
              low=line.lower()
              if any(x in low for x in ("form", "ajax", "fetch(", "axios", "api/", "results", "contest")):
                  compact=" ".join(line.split())
                  if compact:
                      print(compact[:1200])
          PY
