name: Probe selected WCCC 2026 classes

on:
  push:
    branches:
      - feat/private-label-product-awards-poc

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read only relevant WCCC classes
        run: |
          python - <<'PY'
          import json, time, urllib.request

          headers={
              "Accept":"application/json",
              "X-Requested-With":"XMLHttpRequest",
              "User-Agent":"GuardamarMorningDigest/0.13",
          }
          def get(path):
              req=urllib.request.Request("https://myentries.org"+path,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.load(r)

          classes=get("/api/results/contest-classes/71")
          selected=[]
          for item in classes:
              name=str(item.get("name",""))
              desc=str(item.get("description",""))
              number=item.get("number")
              folded=(name+" "+desc).lower()
              if (
                  "sheep" in folded
                  or "mixed milk" in folded
                  or "mixed-milk" in folded
                  or (isinstance(number,(int,float)) and 108 <= float(number) <= 120)
              ):
                  selected.append(item)
          print("SELECTED_CLASSES",json.dumps(selected,ensure_ascii=False))

          # Small bounded set only. Stop once all expected Valle/Entrepinares
          # names are accounted for or after the reviewed selected classes.
          terms=("valle de san juan","entrepinares")
          matches=[]
          for item in selected:
              cid=item["id"]
              time.sleep(0.35)
              try:
                  result=get(f"/api/results/contest-class-results/{cid}")
              except Exception as e:
                  print("ERROR",item.get("number"),cid,type(e).__name__,str(e)[:120])
                  continue
              raw=json.dumps(result,ensure_ascii=False)
              if any(term in raw.lower() for term in terms):
                  row={"class":item,"result":result}
                  matches.append(row)
                  print("MATCH",json.dumps(row,ensure_ascii=False))
          print("MATCH_COUNT",len(matches))
          PY
