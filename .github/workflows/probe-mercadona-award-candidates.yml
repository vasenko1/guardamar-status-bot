name: Probe ALDI search API

on:
  push:
    branches:
      - feat/private-label-product-awards-poc

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect ALDI search JavaScript
        run: |
          python - <<'PY'
          import re, urllib.request
          ua={"User-Agent":"GuardamarMorningDigest/0.13"}
          url="https://www.aldi.es/_next/static/chunks/pages/search-result-9071c2b05652ec14.js"
          req=urllib.request.Request(url,headers=ua)
          with urllib.request.urlopen(req,timeout=20) as r:
              js=r.read(2_000_000).decode("utf-8","replace")
          print("BYTES",len(js))
          for needle in ("algolia","search","api/","product","query","graphql","elastic"):
              print("===",needle,"===")
              shown=0
              for m in re.finditer(needle,js,re.I):
                  a=max(0,m.start()-450); b=min(len(js),m.start()+900)
                  chunk=re.sub(r"\s+"," ",js[a:b])
                  print(chunk[:1350])
                  shown+=1
                  if shown>=8: break
          print("=== URLS ===")
          seen=set()
          for m in re.finditer(r'https?://[^"\'\s)]+',js):
              u=m.group(0)
              if u not in seen:
                  seen.add(u)
                  print(u[:1200])
          PY
