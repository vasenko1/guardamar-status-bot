name: Probe ALDI search internals

on:
  push:
    branches:
      - feat/private-label-product-awards-poc

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Locate ALDI search module and API
        run: |
          python - <<'PY'
          import re, urllib.parse, urllib.request

          ua={"User-Agent":"GuardamarMorningDigest/0.13"}
          page="https://www.aldi.es/busqueda.html"
          req=urllib.request.Request(page,headers=ua)
          with urllib.request.urlopen(req,timeout=20) as r:
              raw=r.read(2_000_000).decode("utf-8","replace")

          scripts=[]
          for m in re.finditer(r'<script[^>]+src=["\']([^"\']+)["\']',raw,re.I):
              url=urllib.parse.urljoin(page,m.group(1))
              if url not in scripts and "_next/static/chunks/" in url:
                  scripts.append(url)

          print("SCRIPTS",len(scripts))
          for url in scripts:
              try:
                  req=urllib.request.Request(url,headers=ua)
                  with urllib.request.urlopen(req,timeout=20) as r:
                      js=r.read(3_000_000).decode("utf-8","replace")
              except Exception as e:
                  print("ERR",url,type(e).__name__)
                  continue
              interesting=(
                  "17851" in js
                  or "algolia" in js.lower()
                  or "search-result" in js.lower()
                  or "/api/" in js.lower()
                  or "searchquery" in js.lower()
              )
              if not interesting:
                  continue
              print("=== SCRIPT",url,"BYTES",len(js),"===")
              for needle in ("17851","algolia","/api/","searchQuery","search-result","productSearch","searchTerm"):
                  shown=0
                  for m in re.finditer(re.escape(needle),js,re.I):
                      a=max(0,m.start()-600); b=min(len(js),m.start()+1200)
                      chunk=re.sub(r"\s+"," ",js[a:b])
                      print("HIT",needle,chunk[:1800])
                      shown+=1
                      if shown>=6: break
              urls=set(re.findall(r'https?://[^"\'\s)]+',js))
              for u in sorted(urls):
                  if any(k in u.lower() for k in ("api","search","algolia","product")):
                      print("URL",u[:1600])
          PY
