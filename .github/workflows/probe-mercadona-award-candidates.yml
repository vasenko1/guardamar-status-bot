name: Probe WCCC relevant classes

on:
  push:
    branches:
      - feat/private-label-product-awards-poc

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Identify relevant WCCC 2026 classes
        run: |
          python - <<'PY'
          import json, urllib.request

          headers={"Accept":"application/json","User-Agent":"GuardamarMorningDigest/0.13"}
          req=urllib.request.Request("https://myentries.org/api/results/contest-classes/71",headers=headers)
          with urllib.request.urlopen(req,timeout=20) as r:
              classes=json.load(r)
          terms=("mixed","flavored","flavour","sheep","goat","hard cheese","semi-soft","semi-hard")
          for cls in classes:
              blob=(str(cls.get("name",""))+" "+str(cls.get("description",""))).lower()
              if any(term in blob for term in terms):
                  print(cls["id"],cls["number"],cls["name"],"::",cls.get("description","")[:400])
          PY
