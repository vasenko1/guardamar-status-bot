name: Probe WCCC 2026 official results

on:
  push:
    branches:
      - feat/private-label-product-awards-poc

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official WCCC 2026 class winners
        run: |
          python - <<'PY'
          import json, urllib.request

          headers={"Accept":"application/json","User-Agent":"GuardamarMorningDigest/0.13"}
          urls=[
              "https://myentries.org/api/results/contest-classes/71",
              "https://myentries.org/api/results/contest-top-three-per-class/71",
          ]
          for url in urls:
              print("=== URL",url,"===")
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as r:
                  obj=json.load(r)
              if "top-three" in url:
                  print("type",type(obj).__name__)
                  text=json.dumps(obj,ensure_ascii=False)
                  print("bytes",len(text))
                  needles=("valle","palencia","trufa","afrut","semicur","ibérico","iberico")
                  def walk(value,path="root"):
                      if isinstance(value,dict):
                          blob=" ".join(str(v) for v in value.values() if not isinstance(v,(dict,list))).lower()
                          if any(n in blob for n in needles):
                              print("MATCH",path,json.dumps(value,ensure_ascii=False)[:5000])
                          for k,v in value.items():
                              walk(v,f"{path}.{k}")
                      elif isinstance(value,list):
                          for i,v in enumerate(value):
                              walk(v,f"{path}[{i}]")
                  walk(obj)
              else:
                  print(json.dumps(obj,ensure_ascii=False)[:20000])
          PY
