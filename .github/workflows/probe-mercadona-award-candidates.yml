name: Resolve ALDI Naltros data node

on:
  push:
    branches:
      - feat/private-label-product-awards-poc

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract exact Naltros node
        run: |
          python - <<'PY'
          import json, re, urllib.request
          url="https://www.aldi.es/p/cava-brut-190300.html"
          req=urllib.request.Request(url,headers={"User-Agent":"GuardamarMorningDigest/0.13"})
          with urllib.request.urlopen(req,timeout=20) as r:
              raw=r.read(1_000_000).decode("utf-8","replace")
          m=re.search(r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>',raw,re.S)
          if not m: raise SystemExit("NO_NEXT_DATA")
          data=json.loads(m.group(1))
          hits=[]
          def walk(v,path="root"):
              if isinstance(v,dict):
                  blob=json.dumps(v,ensure_ascii=False)
                  if (
                      ("currentPrice" in v or "salesUnit" in v or "productSlug" in v)
                      and ("NALTROS" in blob.upper() or "cava-brut-190300" in blob.lower())
                      and len(blob)<80000
                  ):
                      hits.append((path,v))
                  for k,x in v.items(): walk(x,f"{path}.{k}")
              elif isinstance(v,list):
                  for i,x in enumerate(v): walk(x,f"{path}[{i}]")
          walk(data)
          print("HITS",len(hits))
          for path,obj in hits:
              print("PATH",path)
              print(json.dumps(obj,ensure_ascii=False,sort_keys=True)[:60000])
          PY
