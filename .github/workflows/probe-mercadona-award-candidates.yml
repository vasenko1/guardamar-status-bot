name: Probe WCCC results backend

on:
  push:
    branches:
      - feat/private-label-product-awards-poc

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect WCCC results page
        run: |
          python - <<'PY'
          import html, re, urllib.parse, urllib.request

          headers={"User-Agent":"GuardamarMorningDigest/0.13"}
          base="https://worldchampioncheese.org/results/"
          req=urllib.request.Request(base,headers=headers)
          with urllib.request.urlopen(req,timeout=20) as r:
              raw=r.read().decode("utf-8","replace")
          print("HTML_BYTES",len(raw))
          print("=== INTERESTING HTML ===")
          for line in raw.splitlines():
              low=html.unescape(line).lower()
              if any(k in low for k in ("iframe","myentries","result","score","contestresult","embed","shortcode")):
                  clean=re.sub(r"\s+"," ",html.unescape(line)).strip()
                  if clean:
                      print(clean[:1800])

          scripts=[]
          for m in re.finditer(r'<script[^>]+src=["\']([^"\']+)["\']',raw,re.I):
              url=urllib.parse.urljoin(base,html.unescape(m.group(1)))
              if url not in scripts:
                  scripts.append(url)
          print("=== SCRIPTS ===")
          for url in scripts:
              print(url)

          print("=== JS HITS ===")
          for url in scripts:
              if not urllib.parse.urlsplit(url).hostname.endswith("worldchampioncheese.org"):
                  continue
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=20) as r:
                      data=r.read(2_000_000).decode("utf-8","replace")
              except Exception as e:
                  print("ERR",url,type(e).__name__)
                  continue
              hits=[]
              for pattern in (
                  r'https?://[^"\'\s)]+',
                  r'[^"\']{0,100}(?:myentries|results?|scores?|contest)[^"\']{0,180}',
              ):
                  for m in re.finditer(pattern,data,re.I):
                      value=m.group(0)
                      if value not in hits:
                          hits.append(value)
              if hits:
                  print("SCRIPT",url)
                  for hit in hits[:40]:
                      print(re.sub(r"\s+"," ",hit)[:600])
          PY
