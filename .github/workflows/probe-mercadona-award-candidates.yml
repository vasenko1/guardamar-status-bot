name: Probe ALDI Naltros HTML contract

on:
  push:
    branches:
      - feat/private-label-product-awards-poc

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect exact public page
        run: |
          python - <<'PY'
          import html as htmlmod, json, re, urllib.request
          url="https://www.aldi.es/p/cava-brut-190300.html"
          req=urllib.request.Request(url,headers={"User-Agent":"GuardamarMorningDigest/0.13"})
          with urllib.request.urlopen(req,timeout=20) as r:
              raw=r.read(1_000_000).decode("utf-8","replace")
              print("STATUS",r.status,"BYTES",len(raw),"FINAL",r.geturl())

          for needle in (
              "NALTROS","Cava brut","3.15","3,15","0,75","0.75",
              "4.20","4,20","190300","isAvailable","currentPrice",
              "PRODUCT_DETAIL_GET","11,5","DOP Cava"
          ):
              print("===",needle,"===")
              pos=raw.lower().find(needle.lower())
              if pos<0:
                  print("NOT_FOUND")
                  continue
              snippet=htmlmod.unescape(raw[max(0,pos-1600):pos+6000])
              snippet=re.sub(r"\s+"," ",snippet)
              print(snippet[:7600])

          m=re.search(r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>',raw,re.S)
          if m:
              data=json.loads(m.group(1))
              serialized=json.dumps(data,ensure_ascii=False)
              print("NEXT_BYTES",len(serialized))
              for needle in ("NALTROS","190300","3.15","0,75","PRODUCT_DETAIL_GET"):
                  print("NEXT",needle,serialized.lower().find(needle.lower()))
              print("QUERY",json.dumps(data.get("query"),ensure_ascii=False))
              print("PAGE",data.get("page"))
          else:
              print("NO_NEXT_DATA")
          PY
