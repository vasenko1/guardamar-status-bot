name: Resolve ALDI Naltros nested data

on:
  push:
    branches:
      - feat/private-label-product-awards-poc

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract nested product payload
        run: |
          python - <<'PY'
          import json, re, urllib.request
          url="https://www.aldi.es/p/cava-brut-190300.html"
          req=urllib.request.Request(url,headers={"User-Agent":"GuardamarMorningDigest/0.13"})
          with urllib.request.urlopen(req,timeout=20) as r:
              raw=r.read(1_000_000).decode("utf-8","replace")
          m=re.search(r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>',raw,re.S)
          if not m: raise SystemExit("NO_NEXT_DATA")
          data=json.loads(m.group(1))

          found=[]
          def inspect_string(value,path):
              if "190300" not in value and "NALTROS" not in value.upper():
                  return
              print("STRING_PATH",path,"LEN",len(value))
              print(value[:60000])
              try:
                  nested=json.loads(value)
              except Exception:
                  return
              find_product(nested,path+"::<json>")

          def find_product(v,path="root"):
              if isinstance(v,dict):
                  blob=json.dumps(v,ensure_ascii=False)
                  if (
                      ("currentPrice" in v or "salesUnit" in v or "productSlug" in v)
                      and ("190300" in blob or "NALTROS" in blob.upper())
                  ):
                      found.append((path,v))
                  for k,x in v.items():
                      find_product(x,f"{path}.{k}")
              elif isinstance(v,list):
                  for i,x in enumerate(v):
                      find_product(x,f"{path}[{i}]")
              elif isinstance(v,str):
                  inspect_string(v,path)
          find_product(data)

          print("FOUND",len(found))
          for path,obj in found:
              print("PRODUCT_PATH",path)
              print(json.dumps(obj,ensure_ascii=False,sort_keys=True)[:40000])
          PY
