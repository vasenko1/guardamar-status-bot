name: Probe WCCC results API

on:
  push:
    branches:
      - feat/private-label-product-awards-poc

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect official WCCC API
        run: |
          python - <<'PY'
          import json, re, urllib.request

          headers={"Accept":"application/json","User-Agent":"GuardamarMorningDigest/0.13"}
          js_url="https://worldchampioncheese.org/wp-content/plugins/wccc-usccc-plugin/dist/app.js"
          req=urllib.request.Request(js_url,headers=headers)
          with urllib.request.urlopen(req,timeout=20) as r:
              js=r.read().decode("utf-8","replace")

          print("=== APIDOMAIN CONTEXT ===")
          for m in re.finditer(r"apiDomain",js):
              a=max(0,m.start()-500); b=min(len(js),m.start()+900)
              print(re.sub(r"\s+"," ",js[a:b])[:1400])
              print("---")

          candidates=set(re.findall(r'https://[^"\'\s]+',js))
          print("=== URL CANDIDATES ===")
          for u in sorted(candidates):
              if "myentries" in u.lower() or "api" in u.lower():
                  print(u[:1000])

          bases=["https://myentries.org","https://www.myentries.org","https://worldchampioncheese.org"]
          for base in bases:
              url=base+"/api/results/contests"
              print("=== TRY",url,"===")
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=20) as r:
                      body=r.read()
                      print("status",r.status,"type",r.headers.get_content_type(),"bytes",len(body))
                      print(body.decode("utf-8","replace")[:12000])
              except Exception as e:
                  print("ERROR",type(e).__name__,str(e)[:500])
          PY
