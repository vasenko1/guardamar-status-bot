name: Fishing review

on:
  push:
    branches:
      - fix/fishing-morning-and-card-rules
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Fishing and pinned regression
        run: python -m unittest tests.test_guide tests.test_pinned -v
      - name: Full regression
        run: python -m unittest discover -s tests -v
