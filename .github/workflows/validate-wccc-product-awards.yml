name: Validate WCCC product awards

on:
  push:
    branches:
      - feat/private-label-product-awards-poc

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m compileall -q src tests
      - run: python -m unittest -v tests.test_product_awards tests.test_product_awards_main
      - run: python -m unittest discover -s tests -v
      - name: Live product award preview
        run: python -m telegrambot product-awards-preview
