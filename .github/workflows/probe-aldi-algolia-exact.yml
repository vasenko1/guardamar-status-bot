name: Probe ALDI exact product page

on:
  workflow_dispatch:
  push:
    branches:
      - feat/private-label-product-awards-poc

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect product 48800 SSR data
        run: |
          python - <<'PY'
          import html as htmlmod, json, re, urllib.request
          url="https://www.aldi.es/producto/atun-claro-en-aceite-de-oliva-48800.html"
          req=urllib.request.Request(url,headers={"User-Agent":"GuardamarMorningDigest/0.13"})
          with urllib.request.urlopen(req,timeout=20) as r:
              raw=r.read(2_000_000).decode("utf-8","replace")
          print("STATUS",r.status,"BYTES",len(raw))
          for needle in ("SAL DE PLATA","Atún claro","aceite de oliva","ingred", "48800", "6 x 60"):
              print("===",needle,"===")
              pos=raw.lower().find(needle.lower())
              if pos>=0:
                  clean=re.sub(r"\s+"," ",htmlmod.unescape(raw[max(0,pos-1200):pos+5000]))
                  print(clean[:6200])
          m=re.search(r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>',raw,re.S)
          if m:
              data=json.loads(m.group(1))
              def walk(v,path="root"):
                  if isinstance(v,dict):
                      blob=json.dumps(v,ensure_ascii=False).lower()
                      if ("48800" in blob or "sal de plata" in blob) and len(blob)<50000:
                          print("NODE",path,json.dumps(v,ensure_ascii=False,sort_keys=True)[:12000])
                      for k,x in v.items(): walk(x,f"{path}.{k}")
                  elif isinstance(v,list):
                      for i,x in enumerate(v): walk(x,f"{path}[{i}]")
              walk(data)
          PY
