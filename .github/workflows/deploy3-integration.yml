def build_music_school(
    music_links: Optional[Mapping[str, str]] = None,
    places_link: Optional[str] = None,
) -> str:
    """Build the durable school place card shared by music activities."""

    map_url = html.escape(SCHOOL_MAP_URL, quote=True)
