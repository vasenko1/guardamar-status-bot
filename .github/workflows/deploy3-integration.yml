          )
          replace_once(
              'src/telegrambot/pinned.py',
              '    "swimming": "activities",\n    "football": "activities",\n}',
              '    "swimming": "activities",\n    "football": "activities",\n'
              '    **{key: "activities" for key in MUSIC_ACTIVITY_KEYS},\n}'
          )

          # Places index and durable music-school place card.
          replace_once(
