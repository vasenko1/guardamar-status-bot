              '    "music_vocal",\n'
              '    "music_instruments",\n'
              ')\n'
              'MUSIC_ACTIVITY_META = {\n'
              '    "music_basics": ("🎶", "Музыкальное развитие и грамота"),\n'
              '    "music_vocal": ("🎤", "Вокал и хор"),\n'
              '    "music_instruments": ("🎷", "Музыкальные инструменты"),\n'
