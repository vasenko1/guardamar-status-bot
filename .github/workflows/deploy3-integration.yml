Add `🎼 Школа музыки` under recurring activities.

The project already has a bounded Agrupación Musical Guardamar WordPress REST adapter reading twelve recently modified posts. Its event path deliberately rejects `matrícula`, `curso`, `horarios`, `plazas`, etc. For the program feature, prefer a small deterministic program extractor over broadening event semantics.

One additional bounded daily GET to the same endpoint is acceptable if that keeps event and programme logic isolated. Refactor shared fetching only later if measured cost justifies it.

Track only explicit current facts: Jardín Musical/other school offer, enrollment window, audience/age, schedule facts, contact and registration URL.
'''
          new_deploy3 = '''### Deploy 3 — music activities — completed 2026-09-17

Implemented as one narrow extension of the existing linked-guide architecture:

- one bounded AM Guardamar WordPress recent-post GET at most once per local day inside the existing 16:30 `guide sync`;
- a deterministic `music_school.py` programme snapshot, separate from the existing event adapter and with same-season last-good retention;
- no LLM, category-ID discovery, detail crawl, PDF/Drive parser, browser, new cron, daemon, database or provider framework;
- one durable `🎼 Escuela de Música` place card owning map, address, copyable phone/email, site and reverse activity links;
- one visual `🎵 Музыка` section inside the existing `🎓 Занятия и секции` index;
- three resident-facing activity cards: `🎶 Музыкальное развитие и грамота`, `🎤 Вокал и хор`, `🎷 Музыкальные инструменты`;
- activity cards keep contacts out, link `📍 Escuela de Música` to the internal place card, and preserve the standard upward navigation plus public footer;
- Jardín shows `📝 Записаться` only while its explicit dedicated registration window is open;
- current group schedules link to the official AM Guardamar post, never directly to Drive documents that also contain enrolled-student lists;
- the general Escuela enrolment form is retained as a source fact but is not presented as a group-specific registration action.

The source and information-architecture contract is recorded in ADR 0071. Music source failure preserves the last accepted snapshot and never blocks the rest of linked-guide reconciliation.
'''
          replace_once(
              'docs/kb/14_Activities_and_Programs.md',
              old_deploy3,
              new_deploy3,
          )

          decision_marker = '| --- | --- | --- | --- |\n'
          decision_row = (
              '| 2026-09-17 | Add activity-first music guide cards from bounded AM Guardamar programme state | '
              'Keep the existing event parser separate; read one small recent-post surface daily, retain last-good seasonal facts, '
              'put contacts on a durable Escuela de Música place card, and expose three music activity cards with safe official-post schedule links. '
              '| `adr/0071-music-school-programme-source.md`, `docs/kb/14_Activities_and_Programs.md` |\n'
          )
          replace_once(
              'docs/kb/10_Decision_Log.md',
              decision_marker,
              decision_marker + decision_row,
          )

          pinned_append = '''

## Music activities

Music uses the same activity-first linked-guide UX as municipal sport. Keep one visual `🎵 Музыка` group inside the existing `🎓 Занятия и секции` index; do not create a music category message.

The durable `🎼 Escuela de Música` place card owns the verified map/address, copyable phone/email, school site and reverse links to current music activity cards. Music activity cards do not repeat contact details. Each programme/group row uses `📍 Escuela de Música` as an internal Telegram link once that place card exists, with the verified map as recovery fallback.

Current music activity cards are `🎶 Музыкальное развитие и грамота`, `🎤 Вокал и хор`, and `🎷 Музыкальные инструменты`. A direct registration action is shown only for an explicit currently open programme-specific form; the general school form must not be presented as if it were a group-specific link. Schedule actions point to the official AM Guardamar schedule post rather than its Drive documents because those documents also contain enrolled-student lists.

Every final music/place card must keep `⬅️` navigation to its immediate parent immediately before the standard `📣 обЪявления Гуардамар` footer.
'''
          p = Path('docs/kb/11_Pinned_Message_Content.md')
          text = p.read_text(encoding='utf-8')
          if '## Music activities' not in text:
              p.write_text(text.rstrip() + pinned_append + '\n', encoding='utf-8')

          replace_once(
              'docs/kb/06_Data_Sources.md',
              '| Agrupación Musical Guardamar WordPress posts | Its future public musical events in Guardamar | High for its own published events | One bounded 05:10 REST list refresh of twelve recent posts; changed posts only are extracted | Yes, ADR 0058 |',
              '| Agrupación Musical Guardamar WordPress posts | Future public musical events plus current music-school programme/enrolment/schedule discovery | High for its own published events and school notices | Event path: one bounded 05:10 REST list refresh of twelve recent posts; programme path: one separate bounded 16:30 recent-post GET at most once/day with deterministic normalized last-good state | Yes, ADR 0058 / ADR 0071 |'
          )

          # Self-remove the bootstrap workflow from the final feature tree.
          Path('.github/workflows/deploy3-integration.yml').unlink()
          PY

