              '            f"🏫 {_direct_link(\'CEIP Molivent\', molivent_link)}\\n"\n'
              '            "Здесь проходят муниципальные занятия для детей.\\n\\n"\n'
              '            f"🎼 {_direct_link(\'Escuela de Música\', music_school_link)}\\n"\n'
