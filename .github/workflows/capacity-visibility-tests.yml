name: Capacity hunter regression tests

on:
  pull_request:
    paths:
      - "automation/guardamar_capacity.py"
      - "tests/test_guardamar_capacity.py"
      - "tests/test_capacity_backstop.py"
      - ".github/workflows/capacity-visibility-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capacity-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check module syntax
        run: python -m py_compile automation/guardamar_capacity.py
      - name: Run capacity and backstop tests
        run: |
          python -m unittest discover -s tests -p test_guardamar_capacity.py -v
          python -m unittest discover -s tests -p test_capacity_backstop.py -v
