name: Temporary ALDI NALTROS Probe

on:
  push:
    branches:
      - fix/naltros-aldi-contract

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Product Awards tests
        run: python -m unittest discover -s tests -p 'test_product_awards*.py' -v
      - name: Live read-only Product Awards preview
        run: python -m telegrambot product-awards-preview
