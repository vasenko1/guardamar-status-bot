name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install --disable-pip-version-check .

      - name: Run tests
        run: python -m unittest discover -s tests -v

  promote:
    name: Promote tested commit
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update deploy branch
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: git push origin "$DEPLOY_SHA:refs/heads/deploy"
