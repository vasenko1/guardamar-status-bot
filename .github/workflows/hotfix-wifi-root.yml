name: Wi-Fi root navigation hotfix

on:
  push:
    branches: [hotfix/wifi-root-navigation]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/wifi-root-navigation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply focused navigation hotfix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          pinned = "src/telegrambot/pinned.py"
          replace_once(pinned, '    "wifi": "places",', '    "wifi": "root",')
          replace_once(
              pinned,
              '    youth_centre_link: Optional[str] = None,\n    wifi_link: Optional[str] = None,\n) -> str:',
              '    youth_centre_link: Optional[str] = None,\n) -> str:',
          )
          replace_once(
              pinned,
              '            "Пространство для подростков и молодёжи.\\n\\n"\n            f"📶 {_direct_link(\'Бесплатный Wi-Fi\', wifi_link)}\\n"\n            "7 муниципальных точек, сети и пароли."',
              '            "Пространство для подростков и молодёжи."',
          )
          replace_once(
              pinned,
              'def build_wifi(places_link: Optional[str] = None) -> str:\n    """Build the verified municipal Wi-Fi card."""\n\n    return _with_back_link(\n        WIFI,\n        "К списку мест",\n        places_link,\n    )',
              'def build_wifi(root_link: Optional[str] = None) -> str:\n    """Build the verified municipal Wi-Fi card."""\n\n    return _with_back_link(\n        WIFI,\n        "Полезное о Гуардамаре",\n        root_link,\n    )',
          )
          replace_once(
              pinned,
              '    places_link: Optional[str] = None,\n    activities_link: Optional[str] = None,\n) -> str:',
              '    places_link: Optional[str] = None,\n    activities_link: Optional[str] = None,\n    wifi_link: Optional[str] = None,\n) -> str:',
          )
          replace_once(
              pinned,
              '        f"📍 {_direct_link(\'Места\', places_link)}\\n\\n"\n        f"🎓 {_direct_link(\'Занятия и секции\', activities_link)}"',
              '        f"📍 {_direct_link(\'Места\', places_link)}\\n\\n"\n        f"📶 {_direct_link(\'Бесплатный Wi-Fi\', wifi_link)}\\n\\n"\n        f"🎓 {_direct_link(\'Занятия и секции\', activities_link)}"',
          )
          replace_once(
              pinned,
              '        "places": build_places(\n            polideportivo_link, root_link, youth_centre_link, wifi_link\n        ),',
              '        "places": build_places(\n            polideportivo_link, root_link, youth_centre_link\n        ),',
          )
          replace_once(pinned, '        "wifi": build_wifi(places_link),', '        "wifi": build_wifi(root_link),')
          replace_once(
              pinned,
              '            places_link,\n            activities_link,\n        ),',
              '            places_link,\n            activities_link,\n            wifi_link,\n        ),',
          )

          wifi_tests = "tests/test_wifi_guide.py"
          replace_once(
              wifi_tests,
              'from telegrambot.pinned import build_places, build_wifi',
              'from telegrambot.pinned import build_places, build_root, build_wifi',
          )
          replace_once(wifi_tests, '        self.assertIn("К списку мест", message)', '        self.assertIn("Полезное о Гуардамаре", message)')
          replace_once(
              wifi_tests,
              '    def test_places_branch_links_to_wifi_card(self):\n        message = build_places(wifi_link="https://t.me/c/1/50")\n        self.assertIn("Бесплатный Wi-Fi", message)\n        self.assertIn("https://t.me/c/1/50", message)\n        self.assertIn("7 муниципальных точек, сети и пароли", message)',
              '    def test_root_links_to_wifi_and_places_does_not(self):\n        root = build_root(wifi_link="https://t.me/c/1/50")\n        places = build_places()\n        self.assertIn("Бесплатный Wi-Fi", root)\n        self.assertIn("https://t.me/c/1/50", root)\n        self.assertNotIn("Бесплатный Wi-Fi", places)\n        self.assertNotIn("7 муниципальных точек, сети и пароли", places)',
          )

          pinned_tests = "tests/test_pinned.py"
          replace_once(
              pinned_tests,
              '    build_transport_index,\n    preview_messages,',
              '    build_transport_index,\n    build_wifi,\n    preview_messages,',
          )
          replace_once(
              pinned_tests,
              '            build_pool_outdoor(),\n            build_activities(),',
              '            build_pool_outdoor(),\n            build_wifi(),\n            build_activities(),',
          )
          replace_once(
              pinned_tests,
              '    def test_root_is_compact_four_branch_navigator(self):',
              '    def test_root_is_compact_five_item_navigator(self):',
          )
          replace_once(
              pinned_tests,
              '            "https://t.me/c/1/23",\n        )',
              '            "https://t.me/c/1/23",\n            wifi_link="https://t.me/c/1/24",\n        )',
          )
          replace_once(
              pinned_tests,
              '            \'📍 <a href="https://t.me/c/1/22"><b>Места</b></a>\\n\\n\'\n            \'🎓 <a href="https://t.me/c/1/23"><b>Занятия и секции</b></a>\',',
              '            \'📍 <a href="https://t.me/c/1/22"><b>Места</b></a>\\n\\n\'\n            \'📶 <a href="https://t.me/c/1/24"><b>Бесплатный Wi-Fi</b></a>\\n\\n\'\n            \'🎓 <a href="https://t.me/c/1/23"><b>Занятия и секции</b></a>\',',
          )

          adr = "adr/0068-municipal-wifi-guide-source-watch.md"
          replace_once(
              adr,
              'Add one static `📶 Бесплатный Wi-Fi` card under the existing `📍 Места` branch. Keep the compact root unchanged. The card contains only the seven facts verified from the current official municipal map and uses the established guide footer and backlink conventions.',
              'Add one static `📶 Бесплатный Wi-Fi` card as a direct entry in the compact `📌 Полезное о Гуардамаре` root. Do not classify Wi-Fi as a place. The card contains only the seven facts verified from the current official municipal map and uses the established guide footer and backlink conventions.',
          )
          replace_once(
              adr,
              '- Residents get one useful static Wi-Fi reference card without expanding the pinned root.',
              '- Residents get one useful static Wi-Fi reference card directly from the pinned root; the root intentionally gains one item.',
          )

          kb = "docs/kb/13_Municipal_Wifi.md"
          replace_once(
              kb,
              'The linked city guide exposes one durable `📶 Бесплатный Wi-Fi` card under the existing `📍 Места` branch. It is static resident-facing information; it is not a separate bot, scheduled publisher, or automatically rewritten source feed.',
              'The linked city guide exposes one durable `📶 Бесплатный Wi-Fi` card directly from the `📌 Полезное о Гуардамаре` root. Wi-Fi is not classified as a place. It is static resident-facing information; it is not a separate bot, scheduled publisher, or automatically rewritten source feed.',
          )
          replace_once(
              kb,
              'Place names are map links. The card returns to `К списку мест` and uses the standard public-message footer. The root pinned navigator remains unchanged and compact.',
              'Place names are map links. The card returns to `Полезное о Гуардамаре` and uses the standard public-message footer. The pinned root contains Wi-Fi as one direct item alongside the existing guide sections.',
          )

          log = "docs/kb/10_Decision_Log.md"
          replace_once(
              log,
              'Publish seven reviewed static access points under `Места`; reuse the 16:30 guide sync',
              'Publish seven reviewed static access points directly in `Полезное о Гуардамаре`; reuse the 16:30 guide sync',
          )
          PY
      - name: Install package
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Run full tests
        run: python -m unittest discover -s tests -v
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/telegrambot/pinned.py tests/test_wifi_guide.py tests/test_pinned.py adr/0068-municipal-wifi-guide-source-watch.md docs/kb/13_Municipal_Wifi.md docs/kb/10_Decision_Log.md
          git diff --cached --check
          git commit -m "Move municipal Wi-Fi to guide root"
          git push origin HEAD:hotfix/wifi-root-navigation
