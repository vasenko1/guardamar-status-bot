name: Temporary Rosario fix validation

on:
  push:
    branches:
      - fix/rosario-programme-identity-20261007

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Focused municipal programme tests
        run: python -m unittest tests.test_municipal_agenda.MunicipalProgrammeDisplayTranslationTests
      - name: Full test suite
        run: python -m unittest discover -s tests
