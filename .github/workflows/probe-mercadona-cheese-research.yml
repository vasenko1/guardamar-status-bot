name: Probe WCCC result backend research

on:
  push:
    branches:
      - research/product-awards-mercadona-pool-20260926

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Locate and query WCCC backend
        run: |
          python - <<'PY'
          import json, re, urllib.request

          UA={"Accept":"*/*","User-Agent":"GuardamarMorningDigest/0.13"}

          def raw(url, limit=4_000_000):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=20) as r:
                  return r.status, r.headers.get_content_type(), r.read(limit)

          app="https://worldchampioncheese.org/wp-content/plugins/wccc-usccc-plugin/dist/app.js"
          _,_,body=raw(app)
          text=body.decode("utf-8","replace")

          print("=== APIDOMAIN CONTEXT ===")
          for m in re.finditer(r'apiDomain',text):
              a=max(0,m.start()-1000); b=min(len(text),m.start()+1600)
              print(text[a:b])
              print("\n---")

          print("=== URL CANDIDATES ===")
          urls=[]
          for m in re.finditer(r'https?://[^"\'\\\s)]+',text):
              u=m.group(0)
              if u not in urls:
                  urls.append(u)
          for u in urls:
              if any(k in u.lower() for k in ("wccc","usccc","contest","api","cheese")):
                  print(u)

          # Try domains found manually from app text in the same process.
          domains=[]
          patterns=[
              r'apiDomain:"([^"]+)"',
              r'apiDomain:"?([^",}]+)',
              r'apiDomain=([^,;]+)',
              r'"apiDomain":"([^"]+)"',
          ]
          for pat in patterns:
              for m in re.finditer(pat,text):
                  val=m.group(1).strip()
                  if val.startswith("http") and val not in domains:
                      domains.append(val.rstrip("/"))
          print("DOMAINS",domains)

          for domain in domains:
              print("=== DOMAIN",domain,"===")
              try:
                  _,_,b=raw(domain+"/api/results/contests")
                  print("CONTESTS",b.decode("utf-8","replace")[:12000])
              except Exception as e:
                  print("CONTESTS_ERROR",repr(e))
          PY
