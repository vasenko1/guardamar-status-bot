name: Probe Lyon AJAX research

on:
  push:
    branches:
      - research/product-awards-mercadona-pool-20260926

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Locate searchNewResults backend
        run: |
          python - <<'PY'
          import re, urllib.parse, urllib.request
          page="https://www.concourslyon.com/en/results-dairy-2026"
          headers={"User-Agent":"GuardamarMorningDigest/0.13"}
          def raw(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as r:
                  return r.read(3_000_000).decode("utf-8","replace")
          html=raw(page)
          print("=== INLINE FUNCTION CONTEXT ===")
          for needle in ("searchNewResults","onYearUpdate","resultsContainer","sample_search"):
              pos=0
              for n in range(20):
                  i=html.find(needle,pos)
                  if i<0: break
                  print("NEEDLE",needle,html[max(0,i-1200):i+2500])
                  pos=i+len(needle)
          print("=== SCRIPTS ===")
          scripts=[]
          for m in re.finditer(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I):
              u=urllib.parse.urljoin(page,m.group(1))
              if u not in scripts: scripts.append(u)
          for u in scripts:
              print("SCRIPT",u)
              try: text=raw(u)
              except Exception as e:
                  print("ERR",repr(e)); continue
              if "searchNewResults" in text or "sample_search" in text:
                  print("MATCH_SCRIPT",u)
                  for needle in ("searchNewResults","sample_search","ajax"):
                      pos=0
                      for n in range(20):
                          i=text.find(needle,pos)
                          if i<0: break
                          print(text[max(0,i-1500):i+3500])
                          pos=i+len(needle)
          PY
