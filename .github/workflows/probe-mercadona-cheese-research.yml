name: Probe Lyon cheese search research

on:
  push:
    branches:
      - research/product-awards-mercadona-pool-20260926

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect Lyon cheese search contract
        run: |
          python - <<'PY'
          import re, urllib.request
          url="https://www.concourslyon.com/en/results-wine-2026"
          req=urllib.request.Request(url,headers={"User-Agent":"GuardamarMorningDigest/0.13"})
          with urllib.request.urlopen(req,timeout=20) as r:
              html=r.read(2_000_000).decode("utf-8","replace")
          print("BYTES",len(html))
          print("=== FORMS ===")
          for m in re.finditer(r'<form\b[^>]*>.*?</form>',html,re.I|re.S):
              form=m.group(0)
              low=form.lower()
              if any(k in low for k in ("cheese","dairy","product name","fromage")):
                  print(form[:20000])
                  print("\n---FORM---")
          print("=== AFRUTADO / AJAX / RESULT CONTEXT ===")
          for needle in ("cheese","dairy","ajax","result","search"):
              pos=0
              count=0
              while True:
                  i=html.lower().find(needle,pos)
                  if i<0 or count>=20: break
                  print("NEEDLE",needle,html[max(0,i-600):i+1200])
                  pos=i+len(needle); count+=1
          PY
