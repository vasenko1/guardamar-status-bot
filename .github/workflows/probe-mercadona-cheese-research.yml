name: Probe Frankfurt official result JSON

on:
  push:
    branches:
      - research/product-awards-mercadona-pool-20260926

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query Frankfurt result API
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request

          base="https://www.frankfurt-trophy.com/en/search-result"
          headers={
              "Accept":"application/json, text/javascript, */*; q=0.01",
              "X-Requested-With":"XMLHttpRequest",
              "Referer":"https://www.frankfurt-trophy.com/en/results-dairy-2026",
              "User-Agent":"GuardamarMorningDigest/0.13",
          }
          for name in ("Ibérico", "Ahumado", "Valle"):
              fields={
                  "type":"dairy",
                  "name":name,
                  "yearOfSelection":"2026",
                  "medal":"",
                  "country":"",
                  "subCategory":"",
                  "vintage":"",
                  "color":"",
                  "appellation":"",
                  "category":"",
                  "certification":"",
              }
              url=base+"?"+urllib.parse.urlencode(fields)
              print("=== QUERY",name,"===")
              print("URL",url)
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      body=r.read(1_000_000)
                      print("STATUS",r.status,"TYPE",r.headers.get_content_type(),"BYTES",len(body))
                  print(json.dumps(json.loads(body),ensure_ascii=False,indent=2)[:50000])
              except Exception as e:
                  print("ERROR",repr(e))
          PY
