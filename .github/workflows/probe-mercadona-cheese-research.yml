name: Probe WCCC 2026 Valle results research

on:
  push:
    branches:
      - research/product-awards-mercadona-pool-20260926

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query exact WCCC medal entries
        run: |
          python - <<'PY'
          import json, urllib.request
          UA={"Accept":"application/json","User-Agent":"GuardamarMorningDigest/0.13"}
          url="https://myentries.org/api/results/contest-top-three-per-class/71"
          req=urllib.request.Request(url,headers=UA)
          with urllib.request.urlopen(req,timeout=20) as r:
              data=json.load(r)

          targets=("valle de san juan","trufa","afrutado","iberico anejo","ibérico añejo","semicurado")
          rows=data.get("results",[])
          print("CLASSES",len(rows))
          matches=[]
          for row in rows:
              if not isinstance(row,dict): continue
              cls=row.get("class") or {}
              entries=row.get("entries") or {}
              iterable=entries.values() if isinstance(entries,dict) else entries
              for entry in iterable:
                  if not isinstance(entry,dict): continue
                  text=" ".join(str(entry.get(k) or "") for k in ("maker","company","brand_name","description")).lower()
                  if any(t in text for t in targets):
                      matches.append({
                          "class_id":cls.get("id"),
                          "class_number":cls.get("number"),
                          "class_name":cls.get("name"),
                          "class_description":cls.get("description"),
                          "place":entry.get("place"),
                          "score":entry.get("score_average"),
                          "maker":entry.get("maker"),
                          "company":entry.get("company"),
                          "brand_name":entry.get("brand_name"),
                          "description":entry.get("description"),
                          "city":entry.get("city"),
                          "state":entry.get("state"),
                          "country":entry.get("country"),
                      })
          print(json.dumps(matches,ensure_ascii=False,indent=2))
          PY
