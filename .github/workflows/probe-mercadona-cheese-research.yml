name: Probe Lyon Afrutado official result

on:
  push:
    branches:
      - research/product-awards-mercadona-pool-20260926

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query Afrutado
        run: |
          python - <<'PY'
          import re, urllib.parse, urllib.request
          base="https://www.concourslyon.com/en/results-dairy-2026"
          params={
              "sample_search[name]":"Afrutado",
              "sample_search[yearOfSelection]":"2026",
              "sample_search[medal]":"2",
              "sample_search[country]":"44",
              "sample_search[sampleSubCategory]":"",
              "sample_search[type]":"8",
          }
          url=base+"?"+urllib.parse.urlencode(params)
          print("URL",url)
          req=urllib.request.Request(url,headers={"User-Agent":"GuardamarMorningDigest/0.13"})
          with urllib.request.urlopen(req,timeout=20) as r:
              html=r.read(1_500_000).decode("utf-8","replace")
              print("STATUS",r.status,"FINAL",r.geturl(),"BYTES",len(html))
          for needle in ("Afrutado","Valle de San Juan","Gold 2026","316"):
              print("==",needle,"==")
              pos=0
              for _ in range(20):
                  i=html.lower().find(needle.lower(),pos)
                  if i<0: break
                  print(html[max(0,i-800):i+1800])
                  pos=i+len(needle)
          print("SAMPLE LINKS")
          for m in re.finditer(r'href=["\']([^"\']*/sample/[^"\']+)["\']',html,re.I):
              href=urllib.parse.urljoin(base,m.group(1))
              if "afrut" in html[max(0,m.start()-1000):m.end()+1000].lower() or "valle de san juan" in html[max(0,m.start()-1000):m.end()+1000].lower():
                  print(href)
          PY
