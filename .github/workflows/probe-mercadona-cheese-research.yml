name: Probe Lyon Afrutado JSON research

on:
  push:
    branches:
      - research/product-awards-mercadona-pool-20260926

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query official Lyon search API
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request

          base="https://www.concourslyon.com/en/search-result"
          fields={
              "type":"dairy",
              "name":"Afrutado",
              "yearOfSelection":"2026",
              "medal":"2",
              "country":"",
              "subCategory":"",
              "vintage":"",
              "color":"",
              "appellation":"",
              "category":"",
              "certification":"",
          }
          url=base+"?"+urllib.parse.urlencode(fields)
          print("URL",url)
          req=urllib.request.Request(url,headers={
              "Accept":"application/json, text/javascript, */*; q=0.01",
              "X-Requested-With":"XMLHttpRequest",
              "Referer":"https://www.concourslyon.com/en/results-dairy-2026",
              "User-Agent":"GuardamarMorningDigest/0.13",
          })
          with urllib.request.urlopen(req,timeout=20) as r:
              body=r.read(1_000_000)
              print("STATUS",r.status,"TYPE",r.headers.get_content_type(),"BYTES",len(body))
          obj=json.loads(body)
          print(json.dumps(obj,ensure_ascii=False,indent=2)[:50000])
          PY
