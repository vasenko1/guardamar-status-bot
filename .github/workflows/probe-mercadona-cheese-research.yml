name: Probe Lyon AJAX compact research

on:
  push:
    branches:
      - research/product-awards-mercadona-pool-20260926

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract searchNewResults
        run: |
          python - <<'PY'
          import urllib.request
          url="https://www.concourslyon.com/en/results-dairy-2026"
          req=urllib.request.Request(url,headers={"User-Agent":"GuardamarMorningDigest/0.13"})
          with urllib.request.urlopen(req,timeout=20) as r:
              html=r.read(2_000_000).decode("utf-8","replace")
          marker="function searchNewResults()"
          i=html.find(marker)
          print("INDEX",i)
          if i >= 0:
              print(html[i:i+9000])
          PY
