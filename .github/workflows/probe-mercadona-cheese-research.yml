name: Probe Mercadona smoked cheese research

on:
  push:
    branches:
      - research/product-awards-mercadona-pool-20260926

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find exact smoked Mercadona cheeses
        run: |
          python - <<'PY'
          import json, urllib.request
          UA={"Accept":"application/json","User-Agent":"GuardamarMorningDigest/0.13"}

          def get(url):
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.load(r)

          data=get("https://tienda.mercadona.es/api/categories/54/?lang=es&wh=alc1")
          def products(v):
              if isinstance(v,dict):
                  if "display_name" in v and "id" in v:
                      yield v
                  for vv in v.values():
                      yield from products(vv)
              elif isinstance(v,list):
                  for vv in v:
                      yield from products(vv)

          ids=[]
          for p in products(data):
              name=str(p.get("display_name",""))
              if any(k in name.lower() for k in ("ahumado","ahumada","oveja")):
                  pid=str(p.get("id"))
                  if pid not in ids:
                      ids.append(pid)
                      print("CATEGORY",json.dumps({
                          "id":pid,"name":name,
                          "share_url":p.get("share_url"),
                          "price":p.get("price_instructions"),
                      },ensure_ascii=False))

          print("EXACT")
          for pid in ids:
              obj=get(f"https://tienda.mercadona.es/api/products/{pid}/?lang=es&wh=alc1")
              details=obj.get("details") if isinstance(obj.get("details"),dict) else {}
              nutrition=obj.get("nutrition_information") if isinstance(obj.get("nutrition_information"),dict) else {}
              pi=obj.get("price_instructions") if isinstance(obj.get("price_instructions"),dict) else {}
              print(json.dumps({
                  "id":obj.get("id"),
                  "display_name":obj.get("display_name"),
                  "ean":obj.get("ean"),
                  "brand":obj.get("brand"),
                  "published":obj.get("published"),
                  "unavailable_from":obj.get("unavailable_from"),
                  "unavailable_weekdays":obj.get("unavailable_weekdays"),
                  "share_url":obj.get("share_url"),
                  "suppliers":details.get("suppliers"),
                  "legal_name":details.get("legal_name"),
                  "mandatory_mentions":details.get("mandatory_mentions"),
                  "ingredients":nutrition.get("ingredients"),
                  "unit_price":pi.get("unit_price"),
                  "unit_size":pi.get("unit_size"),
                  "size_format":pi.get("size_format"),
                  "reference_price":pi.get("reference_price"),
                  "reference_format":pi.get("reference_format"),
              },ensure_ascii=False))
          PY
