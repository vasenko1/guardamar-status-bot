name: Probe WCCC class 114 research

on:
  push:
    branches:
      - research/product-awards-mercadona-pool-20260926

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query exact class 114
        run: |
          python - <<'PY'
          import json, urllib.request
          UA={"Accept":"application/json","User-Agent":"GuardamarMorningDigest/0.13"}
          top_url="https://myentries.org/api/results/contest-top-three-per-class/71"
          req=urllib.request.Request(top_url,headers=UA)
          with urllib.request.urlopen(req,timeout=20) as r:
              data=json.load(r)
          for row in data.get("results",[]):
              cls=row.get("class") or {}
              if str(cls.get("number"))=="114":
                  print(json.dumps(row,ensure_ascii=False,indent=2))
          PY
