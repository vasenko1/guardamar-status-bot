name: Temporary activity index mobile UX

# rerun after refreshing existing regression expectations
on:
  push:
    branches:
      - ux-activities-index-mobile

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Apply deterministic patch
        run: python tools/apply_activity_index_mobile_ux.py
      - name: Targeted tests
        run: python -m unittest tests.test_activity_index_ux tests.test_music_pinned tests.test_pinned -v
      - name: Full suite
        run: python -m unittest discover -s tests -v
      - name: Commit feature changes and remove temporary helpers
        run: |
          rm tools/apply_activity_index_mobile_ux.py
          rm .github/workflows/tmp-activity-index-mobile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/telegrambot/pinned.py tests/test_activity_index_ux.py tests/test_music_pinned.py docs/kb/11_Pinned_Message_Content.md
          git add -u tools/apply_activity_index_mobile_ux.py .github/workflows/tmp-activity-index-mobile.yml
          git commit -m "Polish activities index for mobile scanning"
          git push origin HEAD:ux-activities-index-mobile
