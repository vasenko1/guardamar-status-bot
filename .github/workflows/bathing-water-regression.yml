name: Bathing-water regression

on:
  push:
    branches:
      - feat/bathing-water-quality-notifications

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Live official bathing-water parser smoke
        run: |
          PYTHONPATH=src python - <<'PY'
          import asyncio
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from telegrambot.bathing_water import (
              fetch_bathing_water_report,
              fetch_bathing_water_snapshot,
          )

          async def main():
              now = datetime.now(ZoneInfo("Europe/Madrid"))
              programme = await fetch_bathing_water_snapshot(now)
              assert programme["latest_report_url"], programme
              report = await fetch_bathing_water_report(programme, now)
              assert len(report["beaches"]) == 7, report
              print(report["report_start"], report["report_end"])
              print([
                  (
                      beach["name"],
                      beach["water_analysis"],
                      beach["water_appearance"],
                      beach["sand_appearance"],
                  )
                  for beach in report["beaches"]
              ])

          asyncio.run(main())
          PY
