name: Probe Mercadona status

on:
  push:
    branches:
      - feat/private-label-product-awards-poc

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python - <<'PY'
          import json, urllib.request
          url="https://tienda.mercadona.es/api/products/50952/?lang=es&wh=alc1"
          req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"GuardamarMorningDigest/0.13"})
          with urllib.request.urlopen(req,timeout=20) as r:
              obj=json.load(r)
          for key in ("status","published","is_variable_weight","unavailable_from","unavailable_weekdays","limit"):
              print(key, repr(obj.get(key)))
          PY
