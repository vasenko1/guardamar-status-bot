name: Finalize Sporttia UX

on:
  push:
    branches:
      - feature/sporttia-activity-cards
    paths:
      - .github/workflows/finalize-sporttia-ux.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sporttia-activity-cards
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final UX fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/telegrambot/pinned.py',
              '''    for key in SPORT_ACTIVITY_KEYS:\n        emoji, label = SPORT_ACTIVITY_META[key]\n        lines.append(\n            f"{emoji} {_direct_link(label, sport_links.get(key))}"\n        )\n''',
              '''    for key in SPORT_ACTIVITY_KEYS:\n        link = sport_links.get(key)\n        if link is None:\n            continue\n        emoji, label = SPORT_ACTIVITY_META[key]\n        lines.append(f"{emoji} {_direct_link(label, link)}")\n''',
          )

          replace_once(
              'tests/test_sporttia_guide.py',
              '''    def test_activities_index_can_link_each_independent_sport_card(self):\n''',
              '''    def test_activities_index_hides_unpublished_sport_cards(self):\n        message = build_activities(\n            "https://t.me/c/123/59",\n            "https://t.me/c/123/50",\n        )\n        self.assertIn("Плавание", message)\n        for label in (\n            "Художественная гимнастика",\n            "Дзюдо",\n            "Мультиспорт",\n            "Инклюзивный мультиспорт",\n            "Гимнастика для старшего возраста",\n            "Гимнастика Asociación Mujeres",\n        ):\n            with self.subTest(label=label):\n                self.assertNotIn(label, message)\n\n    def test_activities_index_can_link_each_independent_sport_card(self):\n''',
          )
          PY
      - name: Install and test
        run: |
          python -m pip install -e .
          python -m py_compile src/telegrambot/pinned.py tests/test_sporttia_guide.py
          python -m unittest tests.test_sporttia_guide -q
          python -m unittest tests.test_pinned -q
          python -m unittest tests.test_guide_navigation_followup -q
          python -m unittest tests.test_guide -q
          python -m unittest discover -s tests -q
      - name: Commit final fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/telegrambot/pinned.py tests/test_sporttia_guide.py
          git diff --cached --check
          git commit -m "Hide unpublished Sporttia activity links"
          git push origin HEAD:feature/sporttia-activity-cards
