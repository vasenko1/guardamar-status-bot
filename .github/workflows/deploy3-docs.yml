name: Deploy 3 docs

on:
  push:
    branches:
      - deploy3-music-activities-v2

permissions:
  contents: write

jobs:
  docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy3-music-activities-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply documentation patch
        run: python .github/deploy3_docs.py

      - name: Commit documentation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/kb/10_Decision_Log.md docs/kb/11_Pinned_Message_Content.md docs/kb/14_Activities_and_Programs.md
          git commit -m "Document Deploy 3 music activities"
          git push origin HEAD:deploy3-music-activities-v2
