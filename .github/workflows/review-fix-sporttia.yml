name: Apply Sporttia review fix

on:
  push:
    branches:
      - feature/sporttia-activity-cards
    paths:
      - .github/workflows/review-fix-sporttia.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sporttia-activity-cards
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply review fix
        run: |
          echo '' | base64 -d > /tmp/sporttia-review-fix.py
          python /tmp/sporttia-review-fix.py
      - name: Install and test
        run: |
          python -m pip install -e .
          python -m py_compile src/telegrambot/guide.py tests/test_guide.py
          python -m unittest tests.test_guide -q
          python -m unittest tests.test_sporttia_guide -q
          python -m unittest tests.test_pinned -q
          python -m unittest tests.test_guide_navigation_followup -q
          python -m unittest tests.test_wifi_guide -q
          python -m unittest discover -s tests -q
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/telegrambot/guide.py tests/test_guide.py adr/0069-automated-sporttia-activity-cards.md
          git diff --cached --check
          git commit -m "Bound Sporttia checks to once per day"
          git push origin HEAD:feature/sporttia-activity-cards
