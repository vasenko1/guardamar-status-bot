name: Temporary Palau activity UX implementation

on:
  push:
    branches:
      - feature/palau-activity-card-ux
    paths:
      - .github/workflows/tmp-palau-activity-ux.yml

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/palau-activity-card-ux
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Apply focused guide UX patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, got {count}")
              return text.replace(old, new, 1)

          def replace_between(text, start, end, replacement, label):
              first = text.find(start)
              if first < 0:
                  raise SystemExit(f"{label}: start marker missing")
              last = text.find(end, first)
              if last < 0:
                  raise SystemExit(f"{label}: end marker missing")
              return text[:first] + replacement.rstrip() + "\n\n\n" + text[last:]

          path = Path("src/telegrambot/pinned.py")
          text = path.read_text(encoding="utf-8")

          text = replace_once(
              text,
              'PALAU_SANT_JAUME_MAP_URL = "https://maps.app.goo.gl/Jp7EA9RqrZQPcVq17"\n',
              'PALAU_SANT_JAUME_MAP_URL = "https://maps.app.goo.gl/Jp7EA9RqrZQPcVq17"\n'
              'SPORT_MEDICAL_CERTIFICATE_URL = (\n'
              '    "https://www.guardamardelsegura.es/wp-content/uploads/2023/03/"\n'
              '    "Certificado-medico-deportivo-ACTUALIZADO.pdf"\n'
              ')\n'
              'SPORTS_CONTACT_EMAIL = "deportesguardamar@hotmail.com"\n',
              "constants",
          )

          text = replace_once(
              text,
              '    "pool_outdoor",\n    "youth_centre",\n',
              '    "pool_outdoor",\n    "palau_sant_jaume",\n    "youth_centre",\n',
              "guide key",
          )
          text = replace_once(
              text,
              '    "pool_outdoor": "polideportivo",\n    "youth_centre": "places",\n',
              '    "pool_outdoor": "polideportivo",\n    "palau_sant_jaume": "polideportivo",\n    "youth_centre": "places",\n',
              "parent key",
          )

          new_place_block = '''def build_polideportivo(
              indoor_link: Optional[str] = None,
              outdoor_link: Optional[str] = None,
              places_link: Optional[str] = None,
              palau_link: Optional[str] = None,
          ) -> str:
              """Build the municipal sports-complex card."""

              palau_target = palau_link or PALAU_SANT_JAUME_MAP_URL
              return _with_back_link(
                  with_footer(
                      f"🏟 <a href=\\"{POLIDEPORTIVO_MAP_URL}\\"><b>Polideportivo Municipal</b></a>\\n\\n"
                      "Муниципальный спортивный комплекс Гуардамара.\\n\\n"
                      f"🏊 {_direct_link('Крытый бассейн Manel Estiarte', indoor_link)}\\n"
                      f"☀️ {_direct_link('Открытый муниципальный бассейн', outdoor_link)}\\n"
                      f"🏟 {_direct_link('Palau Sant Jaume', palau_target)}\\n\\n"
                      "<b>Также в комплексе:</b>\\n"
                      f"🎾 <a href=\\"{TENNIS_COURT_MAP_URL}\\">теннис и падель</a>\\n"
                      "💪 тренажёрный зал и калистеника\\n"
                      "🥎 frontón"
                  ),
                  "К списку мест",
                  places_link,
              )


          def build_palau_sant_jaume(
              sport_links: Optional[Mapping[str, str]] = None,
              polideportivo_link: Optional[str] = None,
          ) -> str:
              """Build the Palau place card and its source-backed activity links."""

              lines = [
                  "🏟 <b>Palau Sant Jaume</b>",
                  "",
                  "Крытый спортивный павильон в составе Polideportivo Municipal.",
                  "",
                  f'<a href="{PALAU_SANT_JAUME_MAP_URL}">📍 <b>Palau Sant Jaume</b></a>',
                  "Av. Europa, s/n",
                  "📞 <b>Телефон:</b> <code>966726335</code>",
                  f"✉️ <b>Email:</b> <code>{SPORTS_CONTACT_EMAIL}</code>",
                  "",
                  "<b>Внутри:</b>",
                  "🏟 центральная спортивная площадка",
                  "🏀 баскетбол · футзал · волейбол · бадминтон",
                  "🤸 2 многофункциональных зала",
                  "🏋️ зал силовых тренировок",
              ]
              sport_links = sport_links or {}
              linked_sports = [
                  (key, sport_links[key])
                  for key in SPORT_ACTIVITY_KEYS
                  if key in sport_links
              ]
              if linked_sports:
                  lines.extend(["", "🎓 <b>Занятия здесь:</b>"])
                  for key, link in linked_sports:
                      emoji, label = SPORT_ACTIVITY_META[key]
                      lines.append(f"{emoji} {_direct_link(label, link)}")
              return _with_back_link(
                  with_footer("\\n".join(lines)),
                  "Polideportivo Municipal",
                  polideportivo_link,
              )'''
          text = replace_between(
              text,
              "def build_polideportivo(",
              "def build_pool_indoor(",
              new_place_block,
              "place builders",
          )

          text = replace_once(
              text,
              '            "📱 <b>WhatsApp:</b> 609 006 754\\n"\n'
              '            "✉️ <b>Email:</b> juventudguardamar@gmail.com"\n',
              '            "📱 <b>WhatsApp:</b> <code>609006754</code>\\n"\n'
              '            "✉️ <b>Email:</b> <code>juventudguardamar@gmail.com</code>"\n',
              "youth contacts",
          )

          new_venue = '''def _venue_markup(value: str, palau_link: Optional[str] = None) -> str:
              if value.startswith("Palau Sant Jaume"):
                  remainder = value[len("Palau Sant Jaume"):].lstrip(" .")
                  target = palau_link or PALAU_SANT_JAUME_MAP_URL
                  result = f'<a href="{target}"><b>Palau Sant Jaume</b></a>'
                  if remainder:
                      result += f" · {html.escape(remainder)}"
                  return result
              return html.escape(value)'''
          text = replace_between(
              text,
              "def _venue_markup(",
              "def _registration_signature(",
              new_venue,
              "venue markup",
          )

          new_group_helpers = '''def _registration_is_open(
              group: Mapping[str, object], local_day: date
          ) -> bool:
              return any(
                  date.fromisoformat(item["start"])
                  <= local_day
                  <= date.fromisoformat(item["end"])
                  for item in group["registrations"]
              )


          def _group_label(key: str, group: Mapping[str, object]) -> str:
              if key == "women_gymnastics":
                  return "Группа"
              suffix = {1: "1-я", 2: "2-я", 3: "3-я", 4: "4-я"}.get(
                  group["group_order"],
                  f'{group["group_order"]}-я',
              )
              return f"{suffix} группа"'''
          text = replace_between(
              text,
              "def _group_label(",
              "def build_sport_activity(",
              new_group_helpers,
              "group helpers",
          )

          new_activity = '''def build_sport_activity(
              key: str,
              catalog: Mapping[str, object],
              local_day: date,
              activities_link: Optional[str] = None,
              palau_link: Optional[str] = None,
          ) -> str:
              """Build one source-backed municipal activity card."""

              if key not in SPORT_ACTIVITY_META:
                  raise ValueError(f"unknown sport activity key: {key}")
              emoji, title = SPORT_ACTIVITY_META[key]
              groups = select_sport_groups(catalog, key, local_day)
              lines = [f"{emoji} <b>{title}</b>"]
              if not groups:
                  lines.extend(
                      [
                          "",
                          "Сейчас актуальные муниципальные группы не опубликованы.",
                          "",
                          f'<a href="{SPORTTIA_CENTER_URL}"><b>Проверить запись</b></a>',
                      ]
                  )
                  return _with_back_link(
                      with_footer("\\n".join(lines)),
                      "К занятиям и секциям",
                      activities_link,
                  )

              first = groups[0]
              lines.extend(
                  [
                      "",
                      "🗓 <b>Сезон:</b> "
                      f"{_format_date_ru(first['season_start'])} — "
                      f"{_format_date_ru(first['season_end'])}",
                  ]
              )

              venues = {group["venue"] for group in groups}
              common_venue = next(iter(venues)) if len(venues) == 1 else None
              if common_venue is not None:
                  lines.append(f"📍 {_venue_markup(common_venue, palau_link)}")

              registrations = {_registration_signature(group) for group in groups}
              common_registration = len(registrations) == 1
              if common_registration:
                  registration = _registration_line(first, local_day)
                  if registration is not None:
                      lines.append(registration)

              lines.append("")
              for index, group in enumerate(groups):
                  if index:
                      lines.append("")
                  label = _group_label(key, group)
                  group_line = f"• <b>{html.escape(label)}</b>"
                  audience = group.get("audience")
                  if audience:
                      group_line += f" · {html.escape(audience)}"
                  lines.append(group_line)
                  if key == "inclusive_multisport":
                      if group["independent"]:
                          lines.append("  👤 Самостоятельное участие")
                      elif group["requires_companion"]:
                          lines.append("  👥 С сопровождающим взрослым")
                  lines.append(f"  {html.escape(group['schedule'])}")
                  if common_venue is None:
                      lines.append(f"  📍 {_venue_markup(group['venue'], palau_link)}")
                  if not common_registration:
                      registration = _registration_line(group, local_day)
                      if registration is not None:
                          lines.append(f"  {registration}")
                  if group["racket_sports"]:
                      lines.append("  🎾 Ракеточные виды спорта")
                  activity_url = html.escape(group["activity_url"], quote=True)
                  if _registration_is_open(group, local_day):
                      lines.append(
                          f'  📝 <a href="{activity_url}"><b>Запись в группу</b></a>'
                      )
                  else:
                      lines.append(
                          f'  🔎 <a href="{activity_url}"><b>Страница группы</b></a>'
                      )

              notes = []
              if any(group["group_may_change"] for group in groups):
                  notes.append(
                      "ℹ️ Распределение по группам может корректироваться организаторами."
                  )
              if any(group["medical_certificate"] for group in groups):
                  notes.extend(
                      [
                          "📄 После записи нужна спортивная медсправка.",
                          f'📎 <a href="{SPORT_MEDICAL_CERTIFICATE_URL}"><b>Скачать бланк</b></a>',
                          f"✉️ <b>Отправить:</b> <code>{SPORTS_CONTACT_EMAIL}</code>",
                      ]
                  )
              if any(group["women_membership"] for group in groups):
                  notes.append(
                      "👩 Также требуется подтверждение членского взноса "
                      "Asociación Mujeres de Guardamar."
                  )
              if notes:
                  lines.append("")
                  lines.extend(notes)

              return _with_back_link(
                  with_footer("\\n".join(lines)),
                  "К занятиям и секциям",
                  activities_link,
              )'''
          text = replace_between(
              text,
              "def build_sport_activity(",
              "def build_swimming(",
              new_activity,
              "activity builder",
          )

          text = replace_once(
              text,
              '        build_pool_outdoor(),\n        build_youth_centre(),\n',
              '        build_pool_outdoor(),\n        build_palau_sant_jaume(),\n        build_youth_centre(),\n',
              "preview palau",
          )

          new_render = '''def _render_messages(
              chat_id: str,
              messages: Mapping[str, int],
          ) -> Dict[str, str]:
              """Render the best complete link graph possible from known identifiers."""

              transport_link = _known_link(chat_id, messages, "transport")
              root_link = _known_link(chat_id, messages, "root")
              places_link = _known_link(chat_id, messages, "places")
              polideportivo_link = _known_link(chat_id, messages, "polideportivo")
              palau_link = _known_link(chat_id, messages, "palau_sant_jaume")
              youth_centre_link = _known_link(chat_id, messages, "youth_centre")
              wifi_link = _known_link(chat_id, messages, "wifi")
              activities_link = _known_link(chat_id, messages, "activities")
              sport_links = {}
              for key in SPORT_ACTIVITY_KEYS:
                  link = _known_link(chat_id, messages, key)
                  if link is not None:
                      sport_links[key] = link
              leaf_links = None
              if all(key in messages for key in LEAF_MESSAGES):
                  leaf_links = {
                      key: telegram_message_link(chat_id, messages[key])
                      for key in LEAF_MESSAGES
                  }
              swimming_link = _known_link(chat_id, messages, "swimming")
              indoor_link = _known_link(chat_id, messages, "pool_indoor")
              outdoor_link = _known_link(chat_id, messages, "pool_outdoor")
              return {
                  **{
                      key: build_leaf_message(key, transport_link)
                      for key in LEAF_MESSAGES
                  },
                  "cameras": build_cameras(root_link),
                  "transport": build_transport_index(leaf_links, root_link),
                  "places": build_places(
                      polideportivo_link, root_link, youth_centre_link
                  ),
                  "polideportivo": build_polideportivo(
                      indoor_link,
                      outdoor_link,
                      places_link,
                      palau_link=palau_link,
                  ),
                  "pool_indoor": build_pool_indoor(swimming_link, polideportivo_link),
                  "pool_outdoor": build_pool_outdoor(swimming_link, polideportivo_link),
                  "palau_sant_jaume": build_palau_sant_jaume(
                      sport_links, polideportivo_link
                  ),
                  "youth_centre": build_youth_centre(places_link),
                  "wifi": build_wifi(root_link),
                  "activities": build_activities(
                      swimming_link, root_link, sport_links
                  ),
                  "swimming": build_swimming(
                      indoor_link, outdoor_link, activities_link
                  ),
                  "root": build_root(
                      _known_link(chat_id, messages, "cameras"),
                      transport_link,
                      places_link,
                      activities_link,
                      wifi_link,
                  ),
              }'''
          text = replace_between(
              text,
              "def _render_messages(",
              "async def _reconcile_messages(",
              new_render,
              "render graph",
          )

          text = replace_once(
              text,
              '        activities_link = _known_link(chat_id, messages, "activities")\n'
              '        for key in SPORT_ACTIVITY_KEYS:\n',
              '        activities_link = _known_link(chat_id, messages, "activities")\n'
              '        palau_link = _known_link(chat_id, messages, "palau_sant_jaume")\n'
              '        for key in SPORT_ACTIVITY_KEYS:\n',
              "publish palau link",
          )
          text = replace_once(
              text,
              '                    key, sporttia_catalog, local_day, activities_link\n'
              '                ),\n',
              '                    key,\n'
              '                    sporttia_catalog,\n'
              '                    local_day,\n'
              '                    activities_link,\n'
              '                    palau_link,\n'
              '                ),\n',
              "activity palau argument",
          )

          path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_palau_activity_ux.py")
          test_path.write_text(r'''import unittest
          from datetime import date, datetime
          from zoneinfo import ZoneInfo

          from telegrambot.pinned import (
              PALAU_SANT_JAUME_MAP_URL,
              SPORT_MEDICAL_CERTIFICATE_URL,
              build_palau_sant_jaume,
              build_polideportivo,
              build_sport_activity,
              build_youth_centre,
          )
          from telegrambot.sporttia import _extract_sporttia_catalog


          MADRID = ZoneInfo("Europe/Madrid")


          def _catalog(rows):
              bodies = []
              for index, row in enumerate(rows, 1):
                  activity_id, title, paragraphs, season = row
                  details = "".join(f"<p>{value}</p>" for value in paragraphs)
                  bodies.append(
                      f'<tbody id="oferta-1509-test-{index}"><tr>'
                      f'<td><a href="https://play.sporttia.com/activities/{activity_id}">{title}</a>'
                      f'<details>{details}</details></td>'
                      f'<td>{season}</td><td><span>Abierta</span></td>'
                      '</tr></tbody>'
                  )
              payload = (
                  '<html><body><div data-offer-blocks data-center-ids="1509">'
                  + "".join(bodies)
                  + '</div></body></html>'
              ).encode("utf-8")
              return _extract_sporttia_catalog(
                  payload,
                  datetime(2026, 9, 16, 16, 30, tzinfo=MADRID),
              )


          class PalauActivityUxTests(unittest.TestCase):
              def test_turnos_remain_visible_groups_but_action_link_is_explicit(self):
                  catalog = _catalog(
                      [
                          (
                              85509,
                              "7. JUDO. Primer turno. Nacidos entre 2011-2020. (Temp. 2026/2027)",
                              [
                                  "NUEVAS INSCRIPCIONES: 01/09/26 al 30/09/26",
                                  "Horario: Miércoles y viernes de 17:00 a 18:30 horas.",
                                  "Clases en Palau Sant Jaume.",
                                  "Se deberá aportar certificado médico correspondiente.",
                              ],
                              "1 oct 2026 – 31 may 2027",
                          ),
                          (
                              85510,
                              "8. JUDO. Segundo turno. Nacidos entre 2011 y 2020. (Temp. 2026/2027)",
                              [
                                  "NUEVAS INSCRIPCIONES: 01/09/26 al 30/09/26",
                                  "Horario: Miércoles y viernes de 18:30 a 20:00 horas.",
                                  "Clases en Palau Sant Jaume.",
                                  "Se deberá aportar certificado médico correspondiente.",
                              ],
                              "1 oct 2026 – 31 may 2027",
                          ),
                      ]
                  )
                  card = build_sport_activity(
                      "judo",
                      catalog,
                      date(2026, 9, 16),
                      "https://t.me/c/123/50",
                      "https://t.me/c/123/77",
                  )
                  self.assertIn("<b>1-я группа</b> · 2011–2020 г.р.", card)
                  self.assertIn("<b>2-я группа</b> · 2011–2020 г.р.", card)
                  self.assertNotIn(
                      '<a href="https://play.sporttia.com/activities/85509"><b>1-я группа</b></a>',
                      card,
                  )
                  self.assertIn(
                      '📝 <a href="https://play.sporttia.com/activities/85509"><b>Запись в группу</b></a>',
                      card,
                  )
                  self.assertIn('href="https://t.me/c/123/77"><b>Palau Sant Jaume</b>', card)
                  self.assertNotIn(PALAU_SANT_JAUME_MAP_URL, card)

              def test_future_registration_uses_neutral_group_page_action(self):
                  catalog = _catalog(
                      [
                          (
                              85522,
                              "MULTIDEPORTE INCLUSIVO. PRIMER TURNO. ALUMNO CON AUTONOMIA. (Temp. 2026/2027) - Mayores de 6 años",
                              [
                                  "NUEVAS INSCRIPCIONES: 01/10/26 al 31/05/27 (o hasta completar inscripciones)",
                                  "Sábado de 10 a 11 horas.",
                                  "Clases en Palau Sant Jaume. Sala Polivalente nº1",
                                  "Se deberá aportar certificado médico correspondiente.",
                              ],
                              "1 oct 2026 – 31 may 2027",
                          ),
                      ]
                  )
                  card = build_sport_activity(
                      "inclusive_multisport",
                      catalog,
                      date(2026, 9, 16),
                  )
                  self.assertIn("<b>1-я группа</b> · от 6 лет", card)
                  self.assertIn("👤 Самостоятельное участие", card)
                  self.assertIn("Sala Polivalente nº1", card)
                  self.assertIn("🔎", card)
                  self.assertIn("Страница группы", card)
                  self.assertNotIn("<b>Запись в группу</b>", card)

              def test_medical_certificate_is_actionable_and_email_is_copyable(self):
                  catalog = _catalog(
                      [
                          (
                              85518,
                              "11. MULTIDEPORTE PRIMER TURNO. Nacidos en 2019 Y 2020. (Temp. 2026/2027)",
                              [
                                  "NUEVAS INSCRIPCIONES: 01/09/26 al 30/09/26",
                                  "Lunes, miércoles y viernes de 16:30 a 17:30 horas.",
                                  "Clases en Palau Sant Jaume.",
                                  "Se deberá aportar certificado médico correspondiente.",
                              ],
                              "1 oct 2026 – 31 may 2027",
                          ),
                      ]
                  )
                  card = build_sport_activity("multisport", catalog, date(2026, 9, 16))
                  self.assertIn("После записи нужна спортивная медсправка", card)
                  self.assertIn(SPORT_MEDICAL_CERTIFICATE_URL, card)
                  self.assertIn("Скачать бланк", card)
                  self.assertIn(
                      "<code>deportesguardamar@hotmail.com</code>",
                      card,
                  )

              def test_palau_is_child_of_polideportivo_and_links_back_to_sports(self):
                  links = {
                      "judo": "https://t.me/c/123/80",
                      "multisport": "https://t.me/c/123/81",
                  }
                  card = build_palau_sant_jaume(
                      links,
                      "https://t.me/c/123/70",
                  )
                  self.assertIn(PALAU_SANT_JAUME_MAP_URL, card)
                  self.assertIn("<code>966726335</code>", card)
                  self.assertIn("<code>deportesguardamar@hotmail.com</code>", card)
                  self.assertIn("2 многофункциональных зала", card)
                  self.assertIn("https://t.me/c/123/80", card)
                  self.assertIn("https://t.me/c/123/81", card)
                  self.assertIn("https://t.me/c/123/70", card)

                  parent = build_polideportivo(
                      "https://t.me/c/123/71",
                      "https://t.me/c/123/72",
                      palau_link="https://t.me/c/123/73",
                  )
                  self.assertIn("https://t.me/c/123/73", parent)
                  self.assertLess(
                      parent.index("Palau Sant Jaume"),
                      parent.index("Также в комплексе"),
                  )
                  self.assertNotIn("🏀 баскетбол\n", parent)

              def test_existing_contact_style_uses_copyable_code(self):
                  youth = build_youth_centre()
                  self.assertIn("<code>609006754</code>", youth)
                  self.assertIn("<code>juventudguardamar@gmail.com</code>", youth)


          if __name__ == "__main__":
              unittest.main()
          '''.replace("          ", ""), encoding="utf-8")

          adr = Path("adr/0069-automated-sporttia-activity-cards.md")
          adr_text = adr.read_text(encoding="utf-8")
          addition = '''

          ## Follow-up UX and place hierarchy

          Palau Sant Jaume is a child place of `Polideportivo Municipal`, alongside
          the indoor and outdoor pools. It is not a peer of the complex in the
          top-level `Места` navigator. Activity cards link their Palau venue to the
          Palau Telegram card; the Palau card links back to the complex and lists
          the already-published activity cards that take place there. Internal
          rooms such as `Sala Polivalente nº1` remain venue detail, not separate
          Telegram cards.

          Public copy describes user actions rather than the registration vendor.
          Source `primer/segundo/... turno` identity is kept as `1-я/2-я/... группа`,
          while the external action is shown separately as `Запись в группу` only
          during an explicit registration interval and `Страница группы` otherwise.
          The vendor name is not shown in resident-facing labels.

          When the source explicitly requires a sports medical certificate, the
          activity card links the municipality's certificate form and shows the
          sports-department email in copyable `<code>` markup. Contact values in
          place cards follow the same copyable style.

          The newer user-facing centre screen exposes live-looking `Alumnos X/Y`
          occupancy values, but those counts are not present in the one bounded
          server-rendered centre response used by this ADR. They are therefore not
          added to the normalized snapshot or public cards. Adding them would first
          require proving that they can be obtained within the same bounded
          one-request architecture without per-activity calls or API reverse
          engineering.
          '''.replace("          ", "")
          if "## Follow-up UX and place hierarchy" not in adr_text:
              adr.write_text(adr_text.rstrip() + addition + "\n", encoding="utf-8")

          research = Path("research/2026-09-16-sporttia-activity-source.md")
          research_text = research.read_text(encoding="utf-8")
          research_addition = '''

          ## Occupancy follow-up

          The current user-facing centre screen at
          `play.sporttia.com/sportcenters/1509/home` displays `Alumnos X/Y` for
          activities. An equal numerator and denominator (for example `30/30`)
          means the displayed enrolled count has reached the displayed capacity at
          that observation. It should not be treated as durable availability because
          cancellations or other centre-side changes can alter the count.

          The already-validated single HTML response from
          `sporttia.com/centros/ayuntamiento-guardamar-del-segura` does not expose
          these occupancy counts. We therefore keep occupancy out of automation
          rather than add another request surface or reverse-engineer a client API.
          '''.replace("          ", "")
          if "## Occupancy follow-up" not in research_text:
              research.write_text(
                  research_text.rstrip() + research_addition + "\n",
                  encoding="utf-8",
              )
          PY
      - name: Focused tests
        run: >-
          PYTHONPATH=src python -m unittest
          tests.test_pinned
          tests.test_sporttia_guide
          tests.test_guide_navigation_followup
          tests.test_palau_activity_ux
          -q
      - name: Full test suite
        run: PYTHONPATH=src python -m unittest discover -s tests -q
