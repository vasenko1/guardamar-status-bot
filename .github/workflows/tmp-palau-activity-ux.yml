        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/telegrambot/pinned.py tests/test_palau_activity_ux.py adr/0069-automated-sporttia-activity-cards.md research/2026-09-16-sporttia-activity-source.md
          git commit -m "feat: link Palau and clarify activity registration UX"
          git push origin HEAD:feature/palau-activity-card-ux
