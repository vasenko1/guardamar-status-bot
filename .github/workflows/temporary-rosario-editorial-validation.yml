name: Temporary Rosario editorial validation

on:
  push:
    branches:
      - fix/rosario-editorial-translation-20261007

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Focused reviewed data tests
        run: python -m unittest tests.test_reviewed
      - name: Focused municipal tests
        run: python -m unittest tests.test_municipal_agenda.MunicipalReviewedRosarioEditorialTests tests.test_municipal_agenda.MunicipalProgrammeDisplayTranslationTests
      - name: Focused Tomorrow Events tests
        run: python -m unittest tests.test_tomorrow_events
      - name: Full test suite
        run: python -m unittest discover -s tests
