name: Bathing-water source research

on:
  push:
    branches:
      - feat/bathing-water-quality-notifications

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Inspect live report metadata and sample dates
        run: |
          PYTHONPATH=src python - <<'PY'
          import re, subprocess, tempfile, urllib.parse, urllib.request
          from datetime import datetime
          from email.utils import parsedate_to_datetime
          from html.parser import HTMLParser
          from zoneinfo import ZoneInfo

          PAGE="https://www.guardamardelsegura.es/programa-de-control-de-las-zonas-de-bano/"
          class P(HTMLParser):
              def __init__(self): super().__init__(convert_charrefs=True); self.href=None; self.parts=[]; self.anchors=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()=="a": self.href=dict(attrs).get("href"); self.parts=[]
              def handle_data(self,data):
                  if self.href: self.parts.append(" ".join(data.split()))
              def handle_endtag(self,tag):
                  if tag.lower()=="a" and self.href:
                      self.anchors.append((self.href," ".join(self.parts))); self.href=None; self.parts=[]
          req=urllib.request.Request(PAGE,headers={"User-Agent":"guardamar-status-bot/1.0"})
          html=urllib.request.urlopen(req,timeout=20).read().decode("utf-8")
          p=P(); p.feed(html)
          pattern=re.compile(r"Fecha:\s*(\d{2})\.(\d{2})\.(2026)\s*[-–—]\s*(\d{2})\.(\d{2})\.(2026)",re.I)
          rows=[]
          for href,label in p.anchors:
              m=pattern.search(label)
              if not m: continue
              url=urllib.parse.urljoin(PAGE,href)
              req=urllib.request.Request(url,headers={"User-Agent":"guardamar-status-bot/1.0"})
              with urllib.request.urlopen(req,timeout=20) as response:
                  lm=response.headers.get("Last-Modified"); payload=response.read(4*1024*1024)
              with tempfile.NamedTemporaryFile(suffix=".pdf") as f:
                  f.write(payload); f.flush()
                  info=subprocess.run(["pdfinfo",f.name],text=True,capture_output=True,check=True).stdout
                  created=next((line.split(":",1)[1].strip() for line in info.splitlines() if line.startswith("CreationDate:")),None)
                  text=subprocess.run(["pdftotext","-layout",f.name,"-"],text=True,capture_output=True,check=True).stdout
              samples=sorted(set(re.findall(r"Fecha desc\. punto1:\s*(\d{2}/\d{2}/\d{2})",text.split("\f",1)[0],re.I)))
              print("REPORT",label,"LAST_MODIFIED",lm,"CREATED",created,"SAMPLES",samples,"URL",url)
          PY
