name: Guardamar capacity search

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Run a read-only audit or one bounded launch attempt"
        required: true
        default: audit
        type: choice
        options:
          - audit
          - launch

permissions:
  contents: read

concurrency:
  group: guardamar-capacity-search
  cancel-in-progress: false

jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      disable_schedule: ${{ steps.capacity.outputs.disable_schedule }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install OCI SDK
        run: python -m pip install "oci==2.185.2"
      - name: Run read-only safety audit
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'audit'
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: python -m automation.guardamar_capacity audit
      - name: Run one bounded capacity attempt
        id: capacity
        if: github.event_name == 'schedule' || inputs.action == 'launch'
        continue-on-error: true
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          GUARDAMAR_LAUNCH_SWITCH: OWNER_AUTHORIZED_PHASE_2
        run: python -m automation.guardamar_capacity launch --allow-launch
      - name: Preserve blocked result
        if: steps.capacity.outcome == 'failure'
        run: exit 1
  disable:
    needs: capacity
    if: always() && needs.capacity.outputs.disable_schedule == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: none
    steps:
      - name: Disable completed or unsafe capacity search
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method PUT
          "repos/${GITHUB_REPOSITORY}/actions/workflows/guardamar-capacity.yml/disable"
