name: Temporary AEMET morning warning UX validation

on:
  push:
    branches:
      - feature/aemet-morning-warning-ux
    paths:
      - .github/workflows/tmp-aemet-morning-warning-ux.yml
      - tools/tmp_apply_aemet_morning_warning_ux.py
      - tools/tmp_fix_aemet_morning_health_indent.py

permissions:
  contents: write

jobs:
  implement-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aemet-morning-warning-ux
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e .
      - name: Apply morning warning UX changes
        run: |
          python tools/tmp_apply_aemet_morning_warning_ux.py
          python tools/tmp_fix_aemet_morning_health_indent.py
      - name: Focused tests
        run: |
          python -m unittest \
            tests.test_aemet \
            tests.test_aemet_warning_updates \
            tests.test_aemet_morning_warning_ux \
            tests.test_digest \
            tests.test_operational_updates \
            -q
      - name: Full test suite
        run: python -m unittest discover -s tests -q
      - name: Commit implementation
        run: |
          git config user.name "vasenko1"
          git config user.email "34131366+vasenko1@users.noreply.github.com"
          git add \
            src/telegrambot/digest.py \
            src/telegrambot/operational_updates.py \
            tests/test_aemet_morning_warning_ux.py \
            tests/test_digest.py
          git commit -m "Polish morning AEMET warning layout"
          git push origin HEAD:feature/aemet-morning-warning-ux
