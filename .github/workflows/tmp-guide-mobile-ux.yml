name: Temporary guide mobile UX implementation

on:
  push:
    branches:
      - feature/guide-ux-final-real
    paths:
      - .github/workflows/tmp-guide-mobile-ux.yml

permissions:
  contents: write

jobs:
  implement-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/guide-ux-final-real
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e .
      - name: Apply UX changes
        run: python tools/tmp_apply_guide_mobile_ux.py
      - name: Focused tests
        run: |
          python -m unittest \
            tests.test_palau_activity_ux \
            tests.test_youth_centre_place \
            tests.test_dynamic_guide_recovery \
            tests.test_sporttia_guide \
            tests.test_pinned -q
      - name: Full test suite
        run: python -m unittest discover -s tests -q
      - name: Commit implementation
        run: |
          git config user.name "vasenko1"
          git config user.email "34131366+vasenko1@users.noreply.github.com"
          git add adr/0069-automated-sporttia-activity-cards.md src/telegrambot/pinned.py tests/test_pinned.py tests/test_youth_centre_place.py tests/test_palau_activity_ux.py tests/test_dynamic_guide_recovery.py
          git commit -m "Polish mobile guide UX and recovery"
          git push origin HEAD:feature/guide-ux-final-real
