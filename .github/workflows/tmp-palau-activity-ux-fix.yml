name: Temporary Palau UX rerun

on:
  push:
    branches:
      - feature/palau-activity-card-ux
    paths:
      - .github/workflows/tmp-palau-activity-ux-fix.yml

permissions:
  contents: write

jobs:
  implement-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/palau-activity-card-ux
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Reuse implementation script and update contact regression
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/tmp-palau-activity-ux.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          script = textwrap.dedent('\n'.join(workflow[start:end])) + '\n'
          Path('/tmp/apply_palau_ux.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/apply_palau_ux.py
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_youth_centre_place.py')
          text = path.read_text(encoding='utf-8')
          old_phone = '        self.assertIn("609 006 754", message)'
          new_phone = '        self.assertIn("<code>609006754</code>", message)'
          old_email = '        self.assertIn("juventudguardamar@gmail.com", message)'
          new_email = '        self.assertIn("<code>juventudguardamar@gmail.com</code>", message)'
          if text.count(old_phone) != 1 or text.count(old_email) != 1:
              raise SystemExit('youth contact assertions did not match expected baseline')
          text = text.replace(old_phone, new_phone, 1).replace(old_email, new_email, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Focused tests
        run: >-
          PYTHONPATH=src python -m unittest
          tests.test_pinned
          tests.test_sporttia_guide
          tests.test_guide_navigation_followup
          tests.test_youth_centre_place
          tests.test_palau_activity_ux
          -q
      - name: Full test suite
        run: PYTHONPATH=src python -m unittest discover -s tests -q
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/telegrambot/pinned.py \
            tests/test_palau_activity_ux.py \
            tests/test_youth_centre_place.py \
            adr/0069-automated-sporttia-activity-cards.md \
            research/2026-09-16-sporttia-activity-source.md
          git commit -m "feat: link Palau and clarify activity registration UX"
          git push origin HEAD:feature/palau-activity-card-ux
