name: Temporary apply airport TLS fix v2

on:
  push:
    branches:
      - fix-airport-tls-recovery

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'ci: run TLS recovery patch helper' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/tmp_apply_airport_tls_fix.py
      - name: Install system PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils openssl
      - name: Install project and pytest
        run: python -m pip install -e . pytest
      - name: Run targeted tests
        run: python -m pytest -q tests/test_airport_schedule.py tests/test_transport_notifications.py
      - name: Commit patched files
        run: |
          git config user.name 'vasenko1'
          git config user.email '34131366+vasenko1@users.noreply.github.com'
          git add src/telegrambot/airport_schedule.py tests/test_airport_schedule.py docs/kb/03_System_Architecture.md docs/kb/04_Runtime_Constraints.md docs/kb/10_Decision_Log.md adr/0043-date-specific-airport-timetable.md adr/0066-bus-siguenza-tls-recovery.md research/2026-09-15-bus-siguenza-tls-recovery.md
          git commit -m 'fix: repair Bus Sigüenza TLS issuer chain'
          git push origin HEAD:fix-airport-tls-recovery
