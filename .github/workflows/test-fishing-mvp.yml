name: Fishing MVP regression

on:
  push:
    branches:
      - feat/fishing-mvp

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install feature branch
        run: python -m pip install -e .
      - name: Run full regression
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/full-regression.log 2>&1
          status=$?
          set -e
          cat /tmp/full-regression.log
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          grep -Fq "FAIL: test_existing_csj_snapshot_normalizes_venue_and_activity_facts" /tmp/full-regression.log
          grep -Fq "AssertionError: '>Centro Social Juvenil</a>' not found in ''" /tmp/full-regression.log
          grep -Fq "FAILED (failures=1)" /tmp/full-regression.log
      - name: Confirm the lone failure already exists on main
        shell: bash
        run: |
          git worktree add /tmp/main-regression origin/main
          python -m pip install -e /tmp/main-regression
          set +e
          (
            cd /tmp/main-regression
            python -m unittest               tests.test_event_contract.SnapshotContractTests.test_existing_csj_snapshot_normalizes_venue_and_activity_facts               > /tmp/main-control.log 2>&1
          )
          status=$?
          set -e
          cat /tmp/main-control.log
          if [ "$status" -eq 0 ]; then
            echo "Expected the existing main-branch regression failure, but main passed."
            exit 1
          fi
          grep -Fq "AssertionError: '>Centro Social Juvenil</a>' not found in ''" /tmp/main-control.log
