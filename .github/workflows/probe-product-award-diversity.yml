name: Probe product award diversity

on:
  push:
    branches:
      - feat/private-label-product-awards-poc

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe exact OCU product blocks
        run: |
          python - <<'PY'
          import re, urllib.request

          headers={"User-Agent":"GuardamarMorningDigest/0.13","Accept":"text/html"}
          cases=[
              ("AOVE","https://www.ocu.org/alimentacion/aceite-oliva/comparador/hacendado-mercadona-aove/196/109008","109008"),
              ("NALTROS","https://www.ocu.org/alimentacion/vino/comparador/naltros-aldi-brut/210/124487","124487"),
          ]
          for label,url,pid in cases:
              print("===",label,pid,"===")
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as r:
                  body=r.read().decode("utf-8","replace")
              needles=[
                  f'data-productphoenixid="{pid}"',
                  f'open-quality-box-{pid}',
                  f'data-selector="open-quality-box-{pid}"',
                  f'data-compare-id="{pid}"',
              ]
              positions=[]
              for needle in needles:
                  start=0
                  while True:
                      pos=body.find(needle,start)
                      if pos<0: break
                      positions.append(pos)
                      start=pos+1
              print("positions",sorted(set(positions)))
              for pos in sorted(set(positions))[:8]:
                  block=body[max(0,pos-3500):pos+5500]
                  print("---BLOCK---")
                  print(re.sub(r"\s+"," ",block)[:9000])
                  print("---END---")
          PY
