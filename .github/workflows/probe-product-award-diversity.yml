name: Probe product award diversity

on:
  push:
    branches:
      - feat/private-label-product-awards-poc

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe OCU AOVE and Mercadona exact SKU
        run: |
          python - <<'PY'
          import json, urllib.request

          headers={"User-Agent":"GuardamarMorningDigest/0.13"}

          print("=== OCU AOVE RAW ===")
          url="https://www.ocu.org/alimentacion/aceite-oliva/comparador/hacendado-mercadona-aove/196/109008"
          req=urllib.request.Request(url,headers={**headers,"Accept":"text/html"})
          with urllib.request.urlopen(req,timeout=20) as r:
              body=r.read().decode("utf-8","replace")
          print("bytes",len(body))
          for needle in ("109008","HACENDADO (MERCADONA) AOVE","89","Compra Maestra","4,86","4.86","1000 ml","Oleoestepa"):
              pos=body.lower().find(needle.lower())
              print("needle",needle,"pos",pos)
              if pos>=0:
                  print(body[max(0,pos-1200):pos+3000].replace("\n"," ")[:4500])

          print("=== MERCADONA SKU 4740 ===")
          url="https://tienda.mercadona.es/api/products/4740/?lang=es&wh=alc1"
          req=urllib.request.Request(url,headers={**headers,"Accept":"application/json"})
          with urllib.request.urlopen(req,timeout=20) as r:
              obj=json.load(r)
          for key in ("id","display_name","ean","brand","packaging","published","unavailable_from","unavailable_weekdays","share_url"):
              print(key,repr(obj.get(key)))
          print("price",json.dumps(obj.get("price_instructions"),ensure_ascii=False))
          print("details",json.dumps(obj.get("details"),ensure_ascii=False))
          print("nutrition",json.dumps(obj.get("nutrition_information"),ensure_ascii=False)[:5000])
          PY
