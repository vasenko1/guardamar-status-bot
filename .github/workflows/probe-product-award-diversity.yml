name: Probe product award diversity

on:
  push:
    branches:
      - feat/private-label-product-awards-poc

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Locate ALDI encoded product payload
        run: |
          python - <<'PY'
          from telegrambot.product_awards import (
              ALDI_NALTROS_URL,
              _aldi_next_data,
              _fetch_raw_html,
          )

          source, final_url = _fetch_raw_html(
              ALDI_NALTROS_URL,
              frozenset({"www.aldi.es", "aldi.es"}),
          )
          data = _aldi_next_data(source)

          def walk(value, path="$"):
              if isinstance(value, dict):
                  for key, child in value.items():
                      yield from walk(child, f"{path}.{key}")
              elif isinstance(value, list):
                  for i, child in enumerate(value):
                      yield from walk(child, f"{path}[{i}]")
              elif isinstance(value, str) and "NALTROS" in value:
                  yield path, value

          found=list(walk(data))
          print("final", final_url)
          print("strings_with_naltros", len(found))
          for path,value in found:
              print("PATH",path,"LEN",len(value))
              pos=value.find("NALTROS")
              print(value[max(0,pos-1000):pos+3000])
          PY
