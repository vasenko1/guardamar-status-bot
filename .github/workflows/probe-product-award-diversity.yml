name: Probe product award diversity

on:
  push:
    branches:
      - feat/private-label-product-awards-poc

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Probe live ALDI parser contract
        run: |
          python - <<'PY'
          import json
          from telegrambot.product_awards import (
              ALDI_NALTROS_URL,
              _aldi_next_data,
              _fetch_raw_html,
              _walk_json_dicts,
          )

          source, final_url = _fetch_raw_html(
              ALDI_NALTROS_URL,
              frozenset({"www.aldi.es", "aldi.es"}),
          )
          print("requested", ALDI_NALTROS_URL)
          print("final", final_url)
          print("bytes", len(source))
          print("next_data_marker", "__NEXT_DATA__" in source)

          data = _aldi_next_data(source)
          print("root_keys", sorted(data) if isinstance(data, dict) else type(data).__name__)
          matches=[]
          for item in _walk_json_dicts(data):
              if item.get("brandName") == "NALTROS ®":
                  matches.append(item)
          print("brand_matches", len(matches))
          for i,item in enumerate(matches):
              print("MATCH", i, json.dumps({
                  "brandName": item.get("brandName"),
                  "salesUnit": item.get("salesUnit"),
                  "isAvailable": item.get("isAvailable"),
                  "isComingSoon": item.get("isComingSoon"),
                  "isRecall": item.get("isRecall"),
                  "currentPrice": item.get("currentPrice"),
                  "productReferences": item.get("productReferences"),
              }, ensure_ascii=False, sort_keys=True))
          PY
