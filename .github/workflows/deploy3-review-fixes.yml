name: Deploy 3 review fixes

on:
  push:
    branches:
      - deploy3-music-activities-v2

permissions:
  contents: write

jobs:
  review-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy3-music-activities-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project
        run: python -m pip install -e .

      - name: Apply review fixes
        run: python .github/deploy3_review_fix.py

      - name: Targeted tests
        run: >-
          python -m unittest
          tests.test_music_school
          tests.test_music_school_hardening
          tests.test_music_pinned
          tests.test_guide
          tests.test_dynamic_guide_recovery
          tests.test_sporttia_guide
          tests.test_guide_navigation_followup
          tests.test_pinned
          -v

      - name: Full test suite
        run: python -m unittest discover -s tests -v

      - name: Commit review fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/telegrambot/music_school.py src/telegrambot/pinned.py
          git commit -m "Harden music programme parsing"
          git push origin HEAD:deploy3-music-activities-v2
