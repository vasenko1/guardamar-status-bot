name: Resolve ALDI search index

on:
  workflow_dispatch:
  push:
    branches:
      - feat/private-label-product-awards-poc

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve region and indexes
        run: |
          python - <<'PY'
          import json, re, urllib.request
          ua={"User-Agent":"GuardamarMorningDigest/0.13"}

          print("=== NEXT DATA ===")
          req=urllib.request.Request("https://www.aldi.es/busqueda.html?query=Sal%20de%20Plata",headers=ua)
          with urllib.request.urlopen(req,timeout=20) as r:
              html=r.read(2_000_000).decode("utf-8","replace")
          m=re.search(r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>',html,re.S)
          if m:
              data=json.loads(m.group(1))
              print(json.dumps({
                  "locale":data.get("locale"),
                  "locales":data.get("locales"),
                  "query":data.get("query"),
                  "pageProps_region":((data.get("props") or {}).get("pageProps") or {}).get("page",{}).get("region"),
              },ensure_ascii=False,sort_keys=True))
              text=json.dumps(data,ensure_ascii=False)
              for token in ("region","REGION","an_prd_es_"):
                  print("TOKEN",token)
                  pos=text.find(token)
                  if pos>=0: print(text[max(0,pos-1000):pos+3000])
          else:
              print("NO_NEXT_DATA")

          print("=== LIST INDEXES ===")
          app="L9KNU74IO7"; key="83df5acd172c42ab174afa4583232b5d"
          url=f"https://{app}-dsn.algolia.net/1/indexes?hitsPerPage=1000"
          headers={
              **ua,
              "x-algolia-application-id":app,
              "x-algolia-api-key":key,
          }
          req=urllib.request.Request(url,headers=headers)
          try:
              with urllib.request.urlopen(req,timeout=20) as r:
                  obj=json.load(r)
              for item in obj.get("items",[]):
                  name=item.get("name","")
                  if name.startswith("an_prd_es_") and "products" in name:
                      print(name)
          except Exception as e:
              print("LIST_ERROR",type(e).__name__,str(e))
          PY
