name: Temporary AEMET warning UX validation

on:
  push:
    branches:
      - feature/aemet-human-warning-updates
    paths:
      - .github/workflows/tmp-aemet-warning-ux.yml

permissions:
  contents: write

jobs:
  implement-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aemet-human-warning-updates
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e .
      - name: Apply AEMET warning changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/tmp_apply_aemet_warning_ux.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("write_text(r'''import io", 'write_text(r"""import io', 1)
          text = text.replace("\n''', encoding=\"utf-8\")", '\n""", encoding="utf-8")', 1)
          path.write_text(text, encoding="utf-8")
          PY
          python tools/tmp_apply_aemet_warning_ux.py
          python - <<'PY'
          from pathlib import Path

          path = Path("src/telegrambot/operational_updates.py")
          text = path.read_text(encoding="utf-8")
          old = '''    current_events = {
        item.get("event", "").casefold() for item in current
    }
'''
          new = '''    changed_events = {
        identity[0] for identity in added_or_changed
    }
'''
          if text.count(old) != 1:
              raise SystemExit("expected current_events block once")
          text = text.replace(old, new, 1)
          old = '''        if item.get("event", "").casefold() in current_events:
            removed_relevant = True
        else:
            early_cancelled.append(item)
'''
          new = '''        event_key = item.get("event", "").casefold()
        same_context_other_parameter = (
            item.get("parameter_code") is not None
            and any(
                candidate.get("event", "").casefold() == event_key
                and candidate.get("starts_at") == item.get("starts_at")
                and candidate.get("ends_at") == item.get("ends_at")
                and candidate.get("parameter_code") != item.get("parameter_code")
                for candidate in current
            )
        )
        if event_key in changed_events or same_context_other_parameter:
            removed_relevant = True
        else:
            early_cancelled.append(item)
'''
          if text.count(old) != 1:
              raise SystemExit("expected removed-warning branch once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test_operational_updates.py")
          tests = test_path.read_text(encoding="utf-8")
          old = '        self.assertEqual(message.count("Обновление AEMET"), 1)\n'
          new = '        self.assertEqual(message.count("AEMET обновила предупреждения"), 1)\n'
          if tests.count(old) != 1:
              raise SystemExit("expected old AEMET title assertion once")
          test_path.write_text(tests.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Focused tests
        run: |
          python -m unittest \
            tests.test_aemet \
            tests.test_aemet_warning_updates \
            tests.test_operational_updates \
            -q
      - name: Full test suite
        run: python -m unittest discover -s tests -q
      - name: Commit implementation
        run: |
          git config user.name "vasenko1"
          git config user.email "34131366+vasenko1@users.noreply.github.com"
          git add \
            src/telegrambot/models.py \
            src/telegrambot/aemet.py \
            src/telegrambot/operational_updates.py \
            tests/test_aemet_warning_updates.py \
            tests/test_operational_updates.py
          git commit -m "Improve AEMET warning updates"
          git push origin HEAD:feature/aemet-human-warning-updates
