name: Temporary AEMET warning UX validation

on:
  push:
    branches:
      - feature/aemet-human-warning-updates
    paths:
      - .github/workflows/tmp-aemet-warning-ux.yml

permissions:
  contents: write

jobs:
  implement-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/aemet-human-warning-updates
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e .
      - name: Apply AEMET warning changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/tmp_apply_aemet_warning_ux.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("write_text(r'''import io", 'write_text(r"""import io', 1)
          text = text.replace("\n''', encoding=\"utf-8\")", '\n""", encoding="utf-8")', 1)
          path.write_text(text, encoding="utf-8")
          PY
          python tools/tmp_apply_aemet_warning_ux.py
      - name: Focused tests
        run: |
          python -m unittest \
            tests.test_aemet \
            tests.test_aemet_warning_updates \
            tests.test_operational_updates \
            -q
      - name: Full test suite
        run: python -m unittest discover -s tests -q
      - name: Commit implementation
        run: |
          git config user.name "vasenko1"
          git config user.email "34131366+vasenko1@users.noreply.github.com"
          git add \
            src/telegrambot/models.py \
            src/telegrambot/aemet.py \
            src/telegrambot/operational_updates.py \
            tests/test_aemet_warning_updates.py
          git commit -m "Improve AEMET warning updates"
          git push origin HEAD:feature/aemet-human-warning-updates
