name: Temporary transport PR tests

on:
  push:
    branches:
      - transport-change-notifications

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install system PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils openssl
      - name: Install project and pytest
        run: python -m pip install -e . pytest
      - name: Run full test suite
        run: python -m pytest -q
