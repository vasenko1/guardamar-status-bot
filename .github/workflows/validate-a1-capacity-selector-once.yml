name: Validate A1 capacity selector

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/validate-a1-capacity-selector-once.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/a1-capacity-report-selector
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Compile capacity automation
        run: python -m compileall -q automation/guardamar_capacity.py tests/test_guardamar_capacity.py
      - name: Run focused capacity tests
        run: python -m unittest tests.test_guardamar_capacity tests.test_capacity_backstop
