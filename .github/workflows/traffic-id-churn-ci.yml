name: Traffic ID churn verification

on:
  push:
    branches:
      - fix/tomtom-traffic-id-churn-20260928
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: PYTHONPATH=src python -m unittest tests.test_traffic -v
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
