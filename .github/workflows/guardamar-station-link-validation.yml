name: Guardamar station link validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Regression suite
        run: python -m unittest discover -s tests -v
      - name: Verify transport station links
        run: |
          python - <<'PY'
          from pathlib import Path
          from telegrambot.pinned import (
              GUARDAMAR_BUS_STATION_MAP_URL,
              LEAF_MESSAGES,
          )

          expected = "38.0877707496%2C-0.6560185196"
          old = (
              "Carrer+Molivent%2C+Guardamar+del+Segura",
              "Estaci%C3%B3n+de+Autobuses%2C+Guardamar+del+Segura",
              "38.087834%2C-0.655759",
          )

          route_keys = (
              "airport",
              "hospital",
              "alicante",
              "elche",
              "south",
              "inland",
              "university",
          )
          for key in route_keys:
              message = LEAF_MESSAGES[key]
              if expected not in message:
                  raise SystemExit(f"{key}: canonical station link missing")
              for value in old:
                  if value in message:
                      raise SystemExit(f"{key}: old station link remains: {value}")

          dynamic_files = (
              "src/telegrambot/airport_schedule.py",
              "src/telegrambot/alicante_schedule.py",
              "src/telegrambot/elche_schedule.py",
              "src/telegrambot/orihuela_schedule.py",
          )
          for filename in dynamic_files:
              text = Path(filename).read_text(encoding="utf-8")
              if "GUARDAMAR_BUS_STATION_MAP_URL" not in text:
                  raise SystemExit(f"{filename}: canonical constant is not used")
              for value in old:
                  if value in text:
                      raise SystemExit(f"{filename}: old station link remains: {value}")

          print(GUARDAMAR_BUS_STATION_MAP_URL)
          print("OK: all transport station links use canonical coordinates")
          PY
