name: Temporary secondary Aurora validation

on:
  push:
    branches:
      - fix/rosario-aurora-secondary-reviewed-key-20261007

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Reviewed data
        run: python -m unittest tests.test_reviewed
      - name: Municipal Rosario regression
        run: python -m unittest tests.test_municipal_agenda.MunicipalReviewedRosarioEditorialTests
      - name: Tomorrow Events
        run: python -m unittest tests.test_tomorrow_events
      - name: Full suite
        run: python -m unittest discover -s tests
