name: Temporary Ayuntamiento fiesta poster tests

on:
  push:
    branches:
      - feat/ayuntamiento-fiesta-poster-backstop

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m compileall -q src tests
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Probe live Ayuntamiento Rosario poster discovery
        run: |
          PYTHONPATH=src python - <<'PY'
          from datetime import date
          from telegrambot.municipal_agenda import (
              POSTER_HOSTS,
              POSTER_LIMIT_BYTES,
              _read_ayuntamiento_programme_candidates,
              _read_ayuntamiento_programme_article,
              _read_url,
          )

          candidates = _read_ayuntamiento_programme_candidates(date(2026, 9, 26))
          print("CANDIDATES:", candidates)
          rosario = next(
              item for item in candidates
              if "virgen-del-rosario" in item["link"]
          )
          detail = _read_ayuntamiento_programme_article(rosario)
          print("DETAIL:", detail)
          assert detail[0].endswith(
              "/2026/09/16/fiestas-en-honor-a-la-virgen-del-rosario-2026/"
          )
          assert "PROG." in detail[2] or "prog" in detail[2].lower()
          assert detail[2].lower().endswith((".jpg", ".jpeg", ".png", ".webp"))
          poster, mime = _read_url(
              detail[2],
              POSTER_HOSTS,
              POSTER_LIMIT_BYTES,
          )
          print("POSTER_BYTES:", len(poster))
          print("POSTER_MIME:", mime)
          assert 100_000 < len(poster) <= POSTER_LIMIT_BYTES
          assert mime in {"image/jpeg", "image/png", "image/webp"}
          PY
