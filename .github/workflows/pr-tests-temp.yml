name: Temporary Turismo completeness tests

on:
  push:
    branches:
      - fix/turismo-programme-completeness

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m compileall -q src tests
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Probe live Rosario date blocks
        run: |
          PYTHONPATH=src python - <<'PY'
          from datetime import date
          from telegrambot.municipal_agenda import (
              _read_turismo_programme_candidates,
              _read_turismo_programme_article,
          )

          candidates = _read_turismo_programme_candidates(date(2026, 9, 26))
          assert candidates is not None
          rosario = next(
              item for item in candidates
              if "virgen-del-rosario" in item["link"]
          )
          detail = _read_turismo_programme_article(
              rosario, date(2026, 9, 26)
          )
          print(rosario)
          print(detail[4] if detail else None)
          assert detail is not None
          expected = {day.isoformat() for day in detail[4]}
          assert "2026-09-26" in expected
          assert "2026-10-15" in expected
          assert "2026-10-18" in expected
          PY
