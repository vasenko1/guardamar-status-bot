name: Temporary Turismo invalid-initial recovery tests

on:
  push:
    branches:
      - fix/turismo-recovery-after-invalid-initial

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m compileall -q src tests
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Probe live Rosario scoped source
        run: |
          PYTHONPATH=src python - <<'PY'
          from datetime import date
          from telegrambot.municipal_agenda import (
              _read_turismo_programme_candidates,
              _read_turismo_programme_article,
              _turismo_programme_recovery_text,
          )

          day = date(2026, 9, 26)
          candidates = _read_turismo_programme_candidates(day)
          assert candidates is not None
          rosario = next(
              item for item in candidates
              if "virgen-del-rosario" in item["link"]
          )
          detail = _read_turismo_programme_article(rosario, day)
          assert detail is not None
          expected = tuple(d for d in detail[4] if d >= day)
          recovery_text = _turismo_programme_recovery_text(
              detail[5], expected
          )
          print("EXPECTED:", expected)
          print("SLICE_LEN:", len(recovery_text))
          print(recovery_text)
          assert date(2026, 9, 26) in expected
          assert "Bingo Benéfico" in recovery_text
          assert "XI Trofeo de Petanca" in recovery_text
          assert "Encuentro de Auroros" in recovery_text
          PY
