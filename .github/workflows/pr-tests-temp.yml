name: Temporary Turismo programme tests

on:
  push:
    branches:
      - feat/turismo-programme-articles

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m compileall -q src tests
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Probe live Turismo programme discovery
        run: |
          PYTHONPATH=src python - <<'PY'
          from datetime import date
          from telegrambot.municipal_agenda import _read_turismo_programme_candidates

          candidates = _read_turismo_programme_candidates(date(2026, 9, 26))
          print(candidates)
          assert candidates is not None
          assert any(
              "virgen-del-rosario" in candidate["link"]
              for candidate in candidates
          )
          PY
