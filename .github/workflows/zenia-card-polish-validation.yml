name: Zenia card polish validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Targeted Zenia tests
        run: |
          python -m unittest tests.test_intercity_schedules.ZeniaScheduleTests -v
          python -m unittest tests.test_pinned.PinnedContentTests.test_zenia_has_a_dedicated_card_and_south_no_longer_claims_it -v
          python -m unittest tests.test_transport_notifications -v
      - name: Render final card
        run: |
          python - <<'PY'
          from datetime import date
          from telegrambot.intercity_schedule import IntercityFare, IntercitySchedule
          from telegrambot.zenia_schedule import build_message

          m = build_message(
              IntercitySchedule(
                  date(2026, 9, 25),
                  ("07:30", "08:50", "10:05"),
                  ("07:30", "08:30", "09:40"),
                  IntercityFare(300),
              ),
              date(2026, 9, 25),
              "https://t.me/c/1/50",
          )
          if "↔" in m:
              raise SystemExit("forbidden ↔ remains in Zenia card")
          for expected in (
              "Гуардамар - Zenia Boulevard",
              "Guardamar - Pilar de la Horadada",
              "Alicante - Pilar de la Horadada",
              "Обратно - в сторону <b>Guardamar</b> или <b>Alicante</b>.",
              "⏱ <b>В пути:</b> около 1 часа",
              "автовокзал Гуардамара</a> → ",
          ):
              if expected not in m:
                  raise SystemExit(f"missing expected copy: {expected}")
          print(m)
          PY
      - name: Full regression suite
        run: python -m unittest discover -s tests -v
