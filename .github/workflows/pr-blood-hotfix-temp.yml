name: Temporary blood donation hotfix regression

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependency
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install package
        run: python -m pip install -e .
      - name: Run blood donation tests
        run: python -m unittest tests.test_blood_donation -v
      - name: Probe current GVA HTML
        run: |
          python - <<'PY'
          import urllib.request
          from datetime import date
          from telegrambot.blood_donation import SOURCE_URL, parse_schedule

          request = urllib.request.Request(
              SOURCE_URL,
              headers={"User-Agent": "GuardamarMorningDigest/0.12"},
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = response.read()

          sessions = parse_schedule(payload, date(2026, 9, 24))
          print("sessions:", sessions)
          assert any(
              item.day.isoformat() == "2026-10-14"
              and item.starts_at.strftime("%H:%M") == "16:45"
              and item.ends_at.strftime("%H:%M") == "20:30"
              for item in sessions
          ), sessions
          PY
      - name: Run full regression suite
        run: python -m unittest discover -s tests -v
