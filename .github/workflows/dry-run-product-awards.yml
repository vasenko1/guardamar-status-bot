name: Dry run product awards

on:
  push:
    branches:
      - feat/private-label-product-awards-poc

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Render three verified test candidates
        run: |
          python - <<'PY'
          from telegrambot.product_awards import (
              AwardEditorialFacts,
              ProductAwardCandidate,
              RetailEvidence,
              build_publication,
          )

          cases = [
              ProductAwardCandidate(
                  source_kind="ocu",
                  event_key="2026|ocu-salmorejo|hacienda",
                  source_url="https://www.ocu.org/alimentacion/platos-preparados/informe/salmorejos",
                  product_name="salmorejo fresco de Hacendado",
                  result="Mejor del Análisis",
                  award_body="OCU",
                  result_year=2026,
                  retail=RetailEvidence(
                      retailer="Mercadona",
                      relationship="private_label",
                      label="Hacendado",
                  ),
                  score="70/100",
                  source_price="3 €/л",
                  editorial=AwardEditorialFacts(
                      comparison_size=30,
                      method_flags=("labeling","composition","nutrition","professional_tasting"),
                      standout="best_professional_tasting",
                      quality_label="Buena Elección",
                  ),
              ),
              ProductAwardCandidate(
                  source_kind="ocu",
                  event_key="2026|ocu-helado|carrefour-extra-black",
                  source_url="https://www.ocu.org/alimentacion/dulces/comparador-helados/carrefour-extra-black-nata-y-chocolate-negro/593/127145",
                  product_name="Carrefour Extra Black nata y chocolate negro",
                  result="Mejor del Análisis",
                  award_body="OCU",
                  result_year=2026,
                  retail=RetailEvidence(
                      retailer="Carrefour",
                      relationship="private_label",
                      label="Carrefour Extra",
                  ),
                  score="65/100",
                  source_price="10,7 €/л",
                  editorial=AwardEditorialFacts(
                      method_flags=("labeling","nutrition"),
                  ),
              ),
              ProductAwardCandidate(
                  source_kind="sabor_del_ano",
                  event_key="2026|dia|263576",
                  source_url="https://www.dia.es/l/productos-premiados-dia",
                  product_name="Burrata fresca Dia Selección Mundial 150 g",
                  result="Sabor del Año 2026",
                  award_body="Sabor del Año",
                  result_year=2026,
                  retail=RetailEvidence(
                      retailer="DIA",
                      relationship="private_label",
                      label="Dia Selección Mundial",
                      product_id="263576",
                      product_url="https://www.dia.es/quesos/fresco/p/263576",
                  ),
              ),
          ]

          for i, case in enumerate(cases, 1):
              print(f"=== DAY {i} ===")
              print(build_publication(case).message)
              print(f"=== END DAY {i} ===")
          PY
