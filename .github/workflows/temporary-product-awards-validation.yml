name: Temporary Product Awards Validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q src tests
      - name: Focused Product Awards tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_product_awards*.py'
      - name: Full repository tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_*.py'
