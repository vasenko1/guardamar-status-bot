name: Temporary Product Awards validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Focused Product Awards tests
        run: python -m unittest discover -s tests -p 'test_product_awards*.py'
      - name: Full repository suite
        run: python -m unittest discover -s tests -p 'test_*.py'
