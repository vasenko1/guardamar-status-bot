name: Temporary Slice D verification

on:
  push:
    branches:
      - feat/sports-foundation-slice-d

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src
      - name: Focused Slice D tests
        env:
          PYTHONPATH: src
        run: |
          python -m unittest \
            tests.test_planning_events \
            tests.test_tomorrow_events \
            tests.test_weekend \
            tests.test_digest \
            tests.test_main
      - name: Full test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests
